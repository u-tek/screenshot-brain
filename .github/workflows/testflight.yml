name: TestFlight

# A signed App Store build of the app and its extensions, uploaded to TestFlight. Run it by hand:
# Actions → TestFlight → Run workflow (the GitHub app can do that too). The build number is the
# run number, so every run uploads a new build.
#
# The team and bundle ID come from Config/TestFlight.xcconfig.
#
# Signing is Xcode's automatic signing, driven by an App Store Connect API key: no certificates or
# profiles live in the repo, Xcode makes what it needs and the distribution certificate is
# cloud-managed. The key needs Admin access. Three repository secrets, from App Store Connect →
# Users and Access → Integrations → Team Keys:
#
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_<key ID>.p8

on:
  workflow_dispatch:

# One upload at a time. A second run waits rather than cancelling one that's mid-upload.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SPM_DIR: ${{ github.workspace }}/.spm

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Identity and API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8" ]]; then
            echo "::error::Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets first (see the top of testflight.yml)."
            exit 1
          fi
          team=$(sed -n 's/^SB_TEAM_ID *= *//p' Config/TestFlight.xcconfig | tr -d '[:space:]')
          if [[ -z "$team" ]]; then
            echo "::error::Fill in SB_TEAM_ID in Config/TestFlight.xcconfig first."
            exit 1
          fi
          echo "SB_TEAM_ID=$team" >> "$GITHUB_ENV"
          cp Config/TestFlight.xcconfig Config/Local.xcconfig
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild archive -project ScreenshotBrain.xcodeproj -scheme ScreenshotBrain -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ScreenshotBrain.xcarchive \
            -derivedDataPath build/Device -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | xcbeautify --renderer github-actions

      # destination "upload" sends the signed build straight to App Store Connect. It shows up in
      # TestFlight once Apple has processed it, usually within half an hour.
      - name: Sign and upload
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>$SB_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ScreenshotBrain.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/Export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
