name: iOS

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "design/**"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshots:
        description: Export design snapshots and commit them to the branch
        type: boolean
        default: true

# macOS minutes are expensive: a newer push cancels the run it supersedes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Sign in with Apple token endpoint in /server. Cheap, so it runs on Linux.
  server:
    name: Account server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: server
        run: node --experimental-strip-types --test test/*.test.ts

  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SPM_DIR: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | python3 -c '
          import re, sys
          apps = [line.strip() for line in sys.stdin if not re.search(r"beta|_rc|release.candidate", line, re.I)]
          key = lambda path: [int(part) for part in re.findall(r"\d+", path.rsplit("/", 1)[-1])]
          print(max(apps, key=key))
          ')
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install tools
        run: |
          brew install xcodegen
          command -v xcbeautify || brew install xcbeautify

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/SBKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick a simulator
        run: |
          destination=$(scripts/sim-destination.sh)
          echo "Using $destination"
          echo "DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Module tests
        working-directory: Packages/SBKit
        run: |
          set -o pipefail
          xcodebuild test -scheme SBKit-Package -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ModuleTests.xcresult" \
            | xcbeautify --renderer github-actions

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app and its UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ScreenshotBrain.xcodeproj -scheme ScreenshotBrain \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Drag the unzipped .app onto a booted simulator to run it (`xcrun simctl install booted ScreenshotBrain.app`).
      - name: Upload the simulator app
        if: github.event_name != 'pull_request'
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent ScreenshotBrain.app "$GITHUB_WORKSPACE/build/ScreenshotBrain-simulator.zip"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ScreenshotBrain-simulator
          path: build/ScreenshotBrain-simulator.zip
          retention-days: 14

      # Opt-in, because it adds several minutes: run the workflow by hand, or put [snapshots]
      # in the commit message.
      - name: Export design snapshots
        id: snapshots
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.snapshots) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshots]'))
        run: scripts/export-snapshots.sh

      # Commits whatever exported, even when some screens failed (the job still fails).
      - name: Commit design snapshots
        if: ${{ !cancelled() && (steps.snapshots.outcome == 'success' || steps.snapshots.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/lab design/screens
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git commit -m "Update design snapshots [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult
          if-no-files-found: ignore
