name: iOS

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "design/**"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshots:
        description: Export design snapshots and commit them to the branch
        type: boolean
        default: true

# macOS minutes are expensive: a newer push cancels the run it supersedes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SPM_DIR: ${{ github.workspace }}/.spm

# Four independent jobs, side by side: nothing waits on the screenshots.
jobs:
  # The Sign in with Apple token endpoint in /server. Cheap, so it runs on Linux.
  server:
    name: Account server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: server
        run: node --experimental-strip-types --test test/*.test.ts

  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Pick a simulator
        run: |
          destination=$(scripts/sim-destination.sh)
          echo "Using $destination"
          echo "DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Module tests
        working-directory: Packages/SBKit
        run: |
          set -o pipefail
          xcodebuild test -scheme SBKit-Package -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ModuleTests.xcresult" \
            | xcbeautify --renderer github-actions

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app and its UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ScreenshotBrain.xcodeproj -scheme ScreenshotBrain \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO SB_ALLOW_LOCAL_ACCOUNT=YES \
            | xcbeautify --renderer github-actions

      # Drag the unzipped .app onto a booted simulator to run it (`xcrun simctl install booted ScreenshotBrain.app`).
      - name: Upload the simulator app
        if: github.event_name != 'pull_request'
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent ScreenshotBrain.app "$GITHUB_WORKSPACE/build/ScreenshotBrain-simulator.zip"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ScreenshotBrain-simulator
          path: build/ScreenshotBrain-simulator.zip
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult
          if-no-files-found: ignore

  # An IPA for sideloading with AltStore: a release build for devices, unsigned, given its App
  # Group entitlement. AltStore re-signs it with your Apple ID. This build lets people skip Sign
  # in with Apple, which free Apple ID signing can't provide.
  ipa:
    name: Sideload IPA
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project ScreenshotBrain.xcodeproj -scheme ScreenshotBrain -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO SB_ALLOW_LOCAL_ACCOUNT=YES \
            | xcbeautify --renderer github-actions
          scripts/package-ipa.sh build/Device/Build/Products/Release-iphoneos/ScreenshotBrain.app build/ScreenshotBrain.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotBrain-sideload-ipa
          path: build/ScreenshotBrain.ipa
          retention-days: 30

  # Opt-in: run the workflow by hand, or put [snapshots] in the commit message to render every
  # screen, or [snapshots: home,item] for just those. One app launch per phone covers them all.
  snapshots:
    name: Design snapshots
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.snapshots) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshots'))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Only the subject line counts, so a commit body can mention the syntax.
      - name: Which screens
        run: |
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$subject" =~ \[snapshots:[[:space:]]*([^]]+)\] ]]; then
            echo "SB_ONLY_ROUTES=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "Rendering only: ${BASH_REMATCH[1]}"
          else
            echo "Rendering every screen"
          fi

      - name: Build the app and its UI tests
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build-for-testing -project ScreenshotBrain.xcodeproj -scheme ScreenshotBrain \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Each phone runs even if another failed or got stuck, so one bad screen never hides the rest.
      - name: iPhone 16 Pro
        id: pro
        continue-on-error: true
        timeout-minutes: 15
        run: scripts/export-snapshots.sh "iPhone 16 Pro"
      - name: iPhone SE
        id: se
        continue-on-error: true
        timeout-minutes: 15
        run: scripts/export-snapshots.sh "iPhone SE (3rd generation)"
      - name: iPhone 16 Pro Max (App Store)
        id: store
        continue-on-error: true
        timeout-minutes: 12
        run: scripts/export-snapshots.sh "iPhone 16 Pro Max"

      - name: Collect the renders
        if: always()
        run: scripts/collect-snapshots.sh

      # Kept even if the push below fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-snapshots
          path: build/design-out/design
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit design snapshots
        if: always()
        run: |
          [[ -d build/design-out/design ]] || { echo "Nothing exported"; exit 0; }
          cp -R build/design-out/design .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/lab design/screens design/appstore
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git commit -m "Update design snapshots [skip ci]"
          # The runner's network occasionally drops for a moment; don't lose the renders to it.
          for wait in 5 15 30 60 0; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            [[ $wait -gt 0 ]] && sleep "$wait"
          done
          exit 1

      - name: Fail if a screen didn't render
        if: always() && (steps.pro.outcome == 'failure' || steps.se.outcome == 'failure' || steps.store.outcome == 'failure')
        run: exit 1
