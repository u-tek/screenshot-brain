# XcodeGen spec. The .xcodeproj is generated from this file and is not committed.
# Run `make project` after cloning and after editing this file.

name: ScreenshotBrain

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(SB_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SBKit:
    path: Packages/SBKit

targets:
  ScreenshotBrain:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screenshot Brain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchMist
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Screenshot Brain reads your screenshots on your iPhone. They never leave your device.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).scan
          - $(PRODUCT_BUNDLE_IDENTIFIER).recap
        SBAppGroupIdentifier: $(SB_APP_GROUP)
        SBCloudKitContainerIdentifier: $(SB_ICLOUD_CONTAINER)
        SBTelemetryDeckAppID: $(SB_TELEMETRYDECK_APP_ID)
        SBRevenueCatAPIKey: $(SB_REVENUECAT_API_KEY)
        SBAccountServerHost: $(SB_ACCOUNT_SERVER_HOST)
    entitlements:
      path: App/ScreenshotBrain.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SB_APP_GROUP)
        com.apple.developer.icloud-container-identifiers:
          - $(SB_ICLOUD_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SB_BUNDLE_ID)
        PRODUCT_NAME: ScreenshotBrain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SBKit
        product: Core
      - package: SBKit
        product: Store
      - package: SBKit
        product: DesignSystem
      - package: SBKit
        product: Safety
      - package: SBKit
        product: ScanEngine
      - package: SBKit
        product: Media
      - package: SBKit
        product: Reveal
      - target: ShareExtension

  # "Share to Screenshot Brain" from Photos: the route for people who don't give photo access.
  # It only copies images into the App Group's inbox; the app reads them.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Screenshot Brain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SBAppGroupIdentifier: $(SB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 60
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SB_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SB_BUNDLE_ID).share
        PRODUCT_NAME: ShareExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        # Item providers call back on their own queues; Swift 5 mode keeps that simple here.
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: SBKit
        product: Core
      - package: SBKit
        product: DesignSystem

  # Exports PNGs of screens for design review (see UITests/SnapshotExportTests.swift).
  ScreenshotBrainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SB_BUNDLE_ID).uitests
    dependencies:
      - target: ScreenshotBrain

schemes:
  ScreenshotBrain:
    build:
      targets:
        ScreenshotBrain: all
        ScreenshotBrainUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenshotBrainUITests
    archive:
      config: Release
