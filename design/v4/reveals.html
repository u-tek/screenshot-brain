<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="kit.js"></script>
<style>
  .phone { background: #07090c; }
  .glow { position: absolute; left: -12px; right: -12px; border-radius: 40px; filter: blur(26px); opacity: .34; }
  .card { position: absolute; left: 20px; width: 353px; height: 220px; border-radius: 28px; overflow: hidden; background: #0c1418; }
  .card svg.art { position: absolute; left: 0; top: 0; display: block; }
  .chip { position: absolute; left: 17px; top: 16px; height: 30px; padding: 0 15px; border-radius: 999px;
    display: flex; align-items: center; font: 500 12px/1 Inter, system-ui, sans-serif; letter-spacing: -.005em; color: #f4f3f1; white-space: nowrap;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.52);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.14); }
  .more { position: absolute; right: 17px; top: 16px; width: 29px; height: 29px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.52);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.14); }
  .tabbar { position: absolute; left: 81.6px; top: 765.4px; width: 229px; height: 55px; border-radius: 28px;
    background: linear-gradient(180deg, rgba(64,64,68,.5) 0%, rgba(24,24,27,.6) 60%, rgba(16,16,18,.66) 100%);
    border: 1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24), inset 0 -1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.45); }
  .tab { position: absolute; top: 0; width: 74px; height: 55px; }
  .tab .ic { position: absolute; left: 0; right: 0; top: 11.8px; height: 17px; display: flex; justify-content: center; }
  .tab .lb { position: absolute; left: 0; right: 0; top: 31.5px; text-align: center; font: 500 10.5px/12px Inter, system-ui, sans-serif; color: rgba(244,243,241,.58); letter-spacing: -.005em; }
  .tab.on .lb { color: #ffffff; }
  .pill { position: absolute; left: 148.8px; top: 3.6px; width: 78.9px; height: 47.9px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.1) 100%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 2px 10px rgba(0,0,0,.25); }
  .ghost-wrap { position: absolute; left: 0; top: 0; }
  .status { padding-left: 50px; }
</style>
</head><body>
<div class="phone" id="root"></div>
<script>
(function () {
  const root = document.getElementById('root');
  const FONT = 'Inter, system-ui, sans-serif';
  const SVGNS = 'http://www.w3.org/2000/svg';

  // Name width at 100pt, so the longest name ("September") can be fitted to the card.
  function measure(text, size, weight) {
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('width', '1000'); s.setAttribute('height', '300');
    s.style.position = 'absolute'; s.style.left = '-9999px'; s.style.top = '0';
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', '0'); t.setAttribute('y', '200');
    t.setAttribute('font-family', FONT); t.setAttribute('font-weight', weight); t.setAttribute('font-size', size);
    t.textContent = text; s.appendChild(t); document.body.appendChild(s);
    const w = t.getComputedTextLength(); s.remove(); return w;
  }
  const CARD_W = 353, CARD_H = 220;
  const NAME_W = measure('September', 100, 600);
  const FS = Math.min(70, 0.92 * CARD_W * 100 / NAME_W);   // one size for all three names, like the reference
  const NAME_BASE = 188;                                    // baseline inside the card

  // ---- Scenes: blurred colour stand-ins for the photos, same composition as the reference ----
  function sceneBlue(i) {
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8ec3"/><stop offset=".5" stop-color="#067fb5"/><stop offset="1" stop-color="#0871a3"/></linearGradient>
      <linearGradient id="sn${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f4f6"/><stop offset=".45" stop-color="#cbd1d7"/><stop offset="1" stop-color="#7d848c"/></linearGradient>
      <linearGradient id="lf${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d3dd"/><stop offset=".45" stop-color="#4f7892"/><stop offset="1" stop-color="#34586f"/></linearGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <path d="M-30 128 C 0 122, 30 118, 60 112 C 78 106, 86 102, 95 98 C 120 84, 150 66, 186 56 L 186 300 L -30 300 Z" fill="url(#lf${i})"/>
      <path d="M186 56 C 215 74, 260 96, 300 124 C 325 140, 345 150, 383 160 L 383 300 L 186 300 Z" fill="url(#sn${i})"/>
      <path d="M186 56 C 170 74, 150 80, 128 96 C 110 110, 96 122, 80 146 L 110 150 C 124 130, 140 116, 160 102 C 170 92, 180 80, 186 56 Z" fill="#1f5b80" opacity=".8"/>
      <path d="M96 98 C 84 124, 76 150, 52 190 L 80 196 C 98 166, 110 130, 110 104 Z" fill="#245f83" opacity=".75"/>
      <path d="M140 112 C 130 140, 124 170, 110 214 L 134 214 C 146 178, 152 146, 160 120 Z" fill="#2c6a8e" opacity=".55"/>
      <path d="M-30 128 C 0 122, 30 118, 60 112 C 78 106, 86 102, 95 98 L 104 110 C 80 120, 40 130, -30 146 Z" fill="#e6ebef" opacity=".5"/>
      <path d="M250 112 C 268 128, 290 140, 330 150 L 336 162 C 300 152, 270 138, 246 120 Z" fill="#6f7a84" opacity=".5"/>
      <path d="M200 118 C 240 130, 280 140, 300 150 L 260 170 Z" fill="#6f7a84" opacity=".5"/>
      <path d="M120 150 C 150 170, 190 190, 230 210 L 180 230 Z" fill="#3e6a86" opacity=".45"/>
    </g>`;
  }
  function sceneGreen(i) {
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97abb6"/><stop offset=".3" stop-color="#b8c9c8"/><stop offset="1" stop-color="#a7b6b0"/></linearGradient>
      <linearGradient id="hl${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa878"/><stop offset=".45" stop-color="#5f7e4a"/><stop offset=".8" stop-color="#41562f"/><stop offset="1" stop-color="#2c3a22"/></linearGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <path d="M-30 96 C 40 66, 110 52, 180 50 C 252 50, 320 70, 383 100 L 383 300 L -30 300 Z" fill="url(#hl${i})"/>
      <path d="M-30 80 C 60 60, 130 42, 200 46 C 260 50, 320 66, 383 84 L 383 96 C 320 80, 260 66, 200 62 C 130 58, 60 76, -30 98 Z" fill="#c3d2b0" opacity=".35"/>
      <path d="M40 120 C 120 104, 220 110, 383 140 L 383 150 C 220 124, 120 118, 40 132 Z" fill="#a9bb92" opacity=".25"/>
      <path d="M-30 150 C 60 128, 140 130, 220 150 C 290 166, 330 170, 383 176 L 383 300 L -30 300 Z" fill="#2b3822" opacity=".42"/>
      <path d="M-30 210 C 80 190, 200 196, 383 214 L 383 300 L -30 300 Z" fill="#26301e" opacity=".5"/>
    </g>`;
  }
  function sceneDesert(i) {
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b9db8"/><stop offset=".4" stop-color="#aab5c6"/><stop offset="1" stop-color="#a5b0c2"/></linearGradient>
      <linearGradient id="dn${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0703c"/><stop offset=".4" stop-color="#b0552a"/><stop offset=".8" stop-color="#7a3d1e"/><stop offset="1" stop-color="#4a2412"/></linearGradient>
      <linearGradient id="df${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a4520"/><stop offset="1" stop-color="#3b1a0d"/></linearGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <path d="M-30 92 C 40 66, 110 42, 166 40 C 232 38, 300 62, 383 96 L 383 300 L -30 300 Z" fill="url(#dn${i})"/>
      <path d="M-30 122 C 60 104, 120 110, 176 122 C 230 132, 300 120, 383 128 L 383 140 C 300 134, 230 146, 176 136 C 120 124, 60 118, -30 136 Z" fill="#5a2412" opacity=".5"/>
      <path d="M-30 92 C 40 66, 110 42, 166 40 C 232 38, 300 62, 383 96" fill="none" stroke="#f2a266" stroke-width="3" opacity=".45"/>
      <path d="M-30 160 C 70 136, 200 136, 383 152 L 383 300 L -30 300 Z" fill="url(#df${i})"/>
    </g>`;
  }
  const SCENES = [sceneBlue, sceneGreen, sceneDesert];

  // ---- Glass month name: layered SVG, semi-transparent body, bevel highlight and inner shade ----
  function glass(i, name, fs) {
    const base = `font-family="${FONT}" font-weight="600" font-size="${fs}" text-anchor="middle" x="${CARD_W / 2}" y="${NAME_BASE}"`;
    return `<defs>
      <linearGradient id="gb${i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
        <stop offset=".46" stop-color="#e4eaf0" stop-opacity=".72"/>
        <stop offset=".52" stop-color="#b3bcc6" stop-opacity=".6"/>
        <stop offset="1" stop-color="#737c86" stop-opacity=".72"/>
      </linearGradient>
      <filter id="gs${i}" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
      <clipPath id="gc${i}"><text ${base}>${name}</text></clipPath>
    </defs>
    <text ${base} fill="#05090d" opacity=".5" filter="url(#gs${i})" transform="translate(0.4 2.4)">${name}</text>
    <text ${base} fill="url(#gb${i})">${name}</text>
    <g clip-path="url(#gc${i})">
      <text ${base} fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity=".7" transform="translate(1.2 1.6)">${name}</text>
      <text ${base} fill="none" stroke="#0a141c" stroke-width="2" stroke-opacity=".3" transform="translate(-1.2 -1.4)">${name}</text>
    </g>`;
  }

  // Film grain on top of each scene so the colour fields read as a photo.
  function grain(i) {
    return `<defs><filter id="gr${i}"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
      <rect width="${CARD_W}" height="${CARD_H}" filter="url(#gr${i})" opacity=".1" style="mix-blend-mode:overlay"/>`;
  }

  const CARDS = [
    { name: 'September', count: 61, top: 128.5, glow: '#0a78aa' },
    { name: 'August', count: 48, top: 362, glow: '#56684a' },
    { name: 'July', count: 72, top: 595.5, glow: '#8a3c1c' },
  ];

  const dots = `<svg width="14" height="4" viewBox="0 0 14 4" style="display:block"><circle cx="2" cy="2" r="1.4" fill="#f4f3f1"/><circle cx="7" cy="2" r="1.4" fill="#f4f3f1"/><circle cx="12" cy="2" r="1.4" fill="#f4f3f1"/></svg>`;

  let html = '';

  // Ambient glow: the card colours bleed softly into the margins, as in the reference.
  CARDS.forEach(c => {
    html += `<div class="glow" style="top:${c.top - 14}px;height:${CARD_H + 28}px;background:${c.glow}"></div>`;
  });

  // Ghost: the previous month, blurred, behind the header.
  html += `<svg class="ghost-wrap" width="393" height="852" viewBox="0 0 393 852">
    <defs><filter id="ghostBlur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="4.6"/></filter></defs>
    <text x="196.5" y="117" text-anchor="middle" font-family="${FONT}" font-weight="600" font-size="88" fill="rgba(255,255,255,.13)" filter="url(#ghostBlur)">October</text>
    <text x="26" y="115.5" font-family="${FONT}" font-weight="600" font-size="23" fill="#f4f3f1">2026</text>
    <path d="M96 105 l5.5 5.5 l5.5 -5.5" fill="none" stroke="rgba(244,243,241,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(346.9 95.6)" fill="none" stroke="#f4f3f1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>
    </g>
  </svg>`;

  // The three month cards.
  CARDS.forEach((c, i) => {
    html += `<div class="card" style="top:${c.top}px">
      <svg class="art" width="${CARD_W}" height="${CARD_H}" viewBox="0 0 ${CARD_W} ${CARD_H}">
        ${SCENES[i](i)}
        ${grain(i)}
        ${glass(i, c.name, FS.toFixed(2))}
      </svg>
      <div class="chip">${c.count} saved</div>
      <div class="more">${dots}</div>
    </div>`;
  });

  // Floating glass tab bar; Reveals is the lit segment.
  const iHome = `<svg width="18" height="18" viewBox="2 2 20 20" style="display:block"><path d="M12 3.2 L21.2 10.6 V19.6 a1.6 1.6 0 0 1 -1.6 1.6 H15.6 V15.2 H8.4 V21.2 H4.4 a1.6 1.6 0 0 1 -1.6 -1.6 V10.6 Z" fill="rgba(244,243,241,.6)"/></svg>`;
  const iSaved = `<svg width="18" height="18" viewBox="2 2 20 20" style="display:block"><path d="M6.5 2.8 h11 a1.6 1.6 0 0 1 1.6 1.6 V21 L12 17.2 L4.9 21 V4.4 a1.6 1.6 0 0 1 1.6 -1.6 Z" fill="rgba(244,243,241,.6)"/></svg>`;
  const iReveals = `<svg width="18" height="18" viewBox="2 2 20 20" style="display:block"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="#ffffff"/><path d="M8 16V12.5M12 16V8.5M16 16V13.5" stroke="#2a2a2e" stroke-width="2" stroke-linecap="round"/></svg>`;
  const tabCenters = [39.5, 111.6, 186.3];
  html += `<div class="tabbar">
    <div class="pill"></div>
    <div class="tab" style="left:${tabCenters[0] - 37}px"><div class="ic">${iHome}</div><div class="lb">Home</div></div>
    <div class="tab" style="left:${tabCenters[1] - 37}px"><div class="ic">${iSaved}</div><div class="lb">Saved</div></div>
    <div class="tab on" style="left:${tabCenters[2] - 37}px"><div class="ic">${iReveals}</div><div class="lb">Reveals</div></div>
  </div>`;

  root.innerHTML = html;
  root.insertAdjacentHTML('beforeend', statusBar(true));
  root.insertAdjacentHTML('beforeend', '<div class="home-indicator"></div>');
})();
</script>
</body></html>
