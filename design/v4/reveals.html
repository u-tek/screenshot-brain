<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  .glow { position: absolute; left: 0; right: 0; border-radius: 40px; filter: blur(24px); opacity: .08; }
  .card { position: absolute; left: var(--gutter); width: 361px; height: 200px; }
  .card svg.art { position: absolute; left: 0; top: 0; display: block; }
  .chip { position: absolute; left: 16px; top: 16px; height: 28px; padding: 0 12px; border-radius: 14px;
    display: flex; align-items: center; line-height: 1; white-space: nowrap; }
  .more { position: absolute; right: 16px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; }
  .ghost-wrap { position: absolute; left: 0; top: 0; }
</style>
</head><body>
<div class="phone" id="root"></div>
<script>
(function () {
  const root = document.getElementById('root');
  const FONT = 'Inter, system-ui, sans-serif';
  const SVGNS = 'http://www.w3.org/2000/svg';

  // Name width at 100pt, so the longest name ("September") can be fitted to the card.
  function measure(text, size, weight) {
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('width', '1000'); s.setAttribute('height', '300');
    s.style.position = 'absolute'; s.style.left = '-9999px'; s.style.top = '0';
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', '0'); t.setAttribute('y', '200');
    t.setAttribute('font-family', FONT); t.setAttribute('font-weight', weight); t.setAttribute('font-size', size);
    t.textContent = text; s.appendChild(t); document.body.appendChild(s);
    const w = t.getComputedTextLength(); s.remove(); return w;
  }
  // Gutters 16 each side; card height 200 so the three cards and the July name clear the tab bar.
  const CARD_W = 361, CARD_H = 200;
  const NAME_W = measure('September', 100, 600);
  const FS = Math.min(70, 0.92 * CARD_W * 100 / NAME_W);   // one size for all three names, like the reference
  const NAME_BASE = 194;                                    // baseline near the card edge, so the bottom of each name is cut

  // Colour helpers: every colour is one of the five lights, or a neutral, mixed in CSS.
  const V = n => `var(--${n})`;
  const mix = (a, pa, b) => `color-mix(in srgb, ${a} ${pa}%, ${b})`;
  const W = 'white';

  // ---- Scenes: blurred colour stand-ins for the photos, same composition as the reference ----
  // September: lavender sky and shadows with white snow (--products).
  function sceneLavender(i) {
    // Dusk over ridges: a low sun, three layers of ridge stepping down the ramp.
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ramp-2)"/><stop offset=".55" style="stop-color:var(--ramp-3)"/><stop offset="1" style="stop-color:var(--ramp-4)"/></linearGradient>
      <radialGradient id="sun${i}"><stop offset="0" style="stop-color:var(--ramp-5)"/><stop offset=".45" style="stop-color:var(--ramp-4)"/><stop offset="1" style="stop-color:var(--ramp-4)" stop-opacity="0"/></radialGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <circle cx="250" cy="96" r="70" fill="url(#sun${i})"/>
      <path d="M-30 120 L 40 92 L 90 110 L 160 70 L 230 104 L 300 84 L 383 112 L 383 300 L -30 300 Z" style="fill:var(--ramp-3)" opacity=".9"/>
      <path d="M-30 150 L 60 124 L 130 140 L 210 116 L 290 142 L 383 128 L 383 300 L -30 300 Z" style="fill:var(--ramp-2)"/>
      <path d="M-30 186 L 80 164 L 170 178 L 260 160 L 383 176 L 383 300 L -30 300 Z" style="fill:var(--ramp-1)"/>
    </g>`;
  }
  // August: bone sky with sand-apricot hills stepping down the ramp, the palest of the three.
  function sceneSage(i) {
    const c = V('ramp-6'), d = V('ramp-2'), g = V('ground');
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}"/><stop offset=".3" style="stop-color:${mix(c, 55, W)}"/><stop offset="1" style="stop-color:${c}"/></linearGradient>
      <linearGradient id="hl${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ramp-6)"/><stop offset=".45" style="stop-color:var(--ramp-5)"/><stop offset=".8" style="stop-color:var(--ramp-3)"/><stop offset="1" style="stop-color:var(--ramp-2)"/></linearGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <path d="M-30 96 C 40 66, 110 52, 180 50 C 252 50, 320 70, 383 100 L 383 300 L -30 300 Z" fill="url(#hl${i})"/>
      <path d="M40 120 C 120 104, 220 110, 383 140 L 383 150 C 220 124, 120 118, 40 132 Z" style="fill:${c}" opacity=".25"/>
      <path d="M-30 150 C 60 128, 140 130, 220 150 C 290 166, 330 170, 383 176 L 383 300 L -30 300 Z" style="fill:${d}" opacity=".42"/>
      <path d="M-30 210 C 80 190, 200 196, 383 214 L 383 300 L -30 300 Z" style="fill:${mix(d, 75, g)}" opacity=".5"/>
    </g>`;
  }
  // July: coral sky with coral dunes (--places).
  function sceneCoral(i) {
    const c = V('ramp-4'), d = V('ramp-2'), g = V('ground');
    return `<defs>
      <linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}"/><stop offset=".4" style="stop-color:${mix(c, 50, W)}"/><stop offset="1" style="stop-color:${mix(c, 60, W)}"/></linearGradient>
      <linearGradient id="dn${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}"/><stop offset=".4" style="stop-color:${mix(c, 50, d)}"/><stop offset=".8" style="stop-color:${d}"/><stop offset="1" style="stop-color:${mix(d, 70, g)}"/></linearGradient>
      <linearGradient id="df${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${d}"/><stop offset="1" style="stop-color:${mix(d, 60, g)}"/></linearGradient>
      <filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    </defs>
    <g filter="url(#bl${i})">
      <rect x="-30" y="-30" width="413" height="290" fill="url(#sk${i})"/>
      <path d="M-30 92 C 40 66, 110 42, 166 40 C 232 38, 300 62, 383 96 L 383 300 L -30 300 Z" fill="url(#dn${i})"/>
      <path d="M-30 122 C 60 104, 120 110, 176 122 C 230 132, 300 120, 383 128 L 383 140 C 300 134, 230 146, 176 136 C 120 124, 60 118, -30 136 Z" style="fill:${mix(d, 80, g)}" opacity=".5"/>
      <path d="M-30 92 C 40 66, 110 42, 166 40 C 232 38, 300 62, 383 96" fill="none" style="stroke:${mix(c, 60, W)}" stroke-width="3" opacity=".45"/>
      <path d="M-30 160 C 70 136, 200 136, 383 152 L 383 300 L -30 300 Z" fill="url(#df${i})"/>
    </g>`;
  }
  const SCENES = [sceneLavender, sceneSage, sceneCoral];

  // ---- Glass month name: layered SVG, semi-transparent body, bevel highlight and inner shade ----
  function glass(i, name, fs) {
    const base = `font-family="${FONT}" font-weight="600" font-size="${fs}" letter-spacing="-1.5" text-anchor="middle" x="${CARD_W / 2}" y="${NAME_BASE}"`;
    return `<defs>
      <linearGradient id="gb${i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
        <stop offset="1" stop-color="#f6ece2" stop-opacity=".45"/>
      </linearGradient>
    </defs>
    <text ${base} fill="url(#gb${i})" stroke="rgba(255,255,255,.55)" stroke-width=".75">${name}</text>`;
  }

  // Film grain on top of each scene so the colour fields read as a photo.
  function grain(i) {
    return `<defs><filter id="gr${i}"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
      <rect width="${CARD_W}" height="${CARD_H}" filter="url(#gr${i})" opacity=".1" style="mix-blend-mode:overlay"/>`;
  }

  // Each month takes one light: September products, August recipes, July places.
  const CARDS = [
    { name: 'September', count: 61, top: 122, light: 'events' },
    { name: 'August', count: 48, top: 330, light: 'recipes' },
    { name: 'July', count: 72, top: 538, light: 'places' },
  ];
  const SCENE_FOR = { events: sceneLavender, recipes: sceneSage, places: sceneCoral };

  const moreDots = `<svg width="14" height="4" viewBox="0 0 14 4" style="display:block"><circle cx="2" cy="2" r="1.4" style="fill:var(--ink)"/><circle cx="7" cy="2" r="1.4" style="fill:var(--ink)"/><circle cx="12" cy="2" r="1.4" style="fill:var(--ink)"/></svg>`;

  let html = '';

  // Ambient glow: the card colours bleed softly into the margins, as in the reference.
  CARDS.forEach(c => {
    html += `<div class="glow" style="top:${c.top - 14}px;height:${CARD_H + 28}px;background:var(--${c.light}-c)"></div>`;
  });

  // Header row at y = 62: year with chevron on the left, calendar button on the right.
  html += `<div style="position:absolute;top:62px;left:var(--gutter);right:var(--gutter);display:flex;align-items:center;gap:6px;z-index:60">
    <span class="t-large">2026</span>
    <span style="display:inline-flex;transform:rotate(-90deg)">${icon('back', 20)}</span>
    <span style="flex:1"></span>
    <span class="btn-circle">${icon('cal', 20)}</span>
  </div>`;

  // The three month cards.
  CARDS.forEach((c, i) => {
    html += `<div class="tile card" style="top:${c.top}px">
      <svg class="art" width="${CARD_W}" height="${CARD_H}" viewBox="0 0 ${CARD_W} ${CARD_H}">
        <defs><linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#1d0e08" stop-opacity="0"/><stop offset="1" stop-color="#1d0e08" stop-opacity=".5"/></linearGradient></defs>
        ${SCENE_FOR[c.light](i)}
        ${grain(i)}
        <rect width="${CARD_W}" height="${CARD_H}" fill="url(#scrim)"/>
        ${glass(i, c.name, FS.toFixed(2))}
      </svg>
      <div class="glass chip t-label" style="background:rgba(29,14,8,.72)">${c.count} SAVED</div>
      <div class="glass more" style="background:rgba(29,14,8,.72)">${moreDots}</div>
    </div>`;
  });

  // System tab bar on the main screens; Reveals is the active tab.
  html += `<div class="tabbar">
    <div class="tab">${icon('home',20)}Home</div>
    <div class="tab">${icon('bookmark',20)}Saved</div>
    <div class="tab on">${icon('spark',20)}Reveals</div>
  </div>`;

  root.innerHTML = html;
  root.insertAdjacentHTML('beforeend', statusBar(true));
  root.insertAdjacentHTML('beforeend', '<div class="home-indicator"></div>');
  root.insertAdjacentHTML('beforeend', '<div class="grain"></div>');
})();
</script>
</body></html>
