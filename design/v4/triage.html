<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  html, body { background: var(--ground); }

  /* Folder card: the visible image runs from y 122 (under the header) to y 754 (16pt above the
     decision row) and sits on the 16pt gutters. The 8.5 px bezel is outside that box, so the
     card's outer edge is 8.5 px beyond the gutters. */
  .card { position: absolute; left: calc(var(--gutter) - 8.5px); right: calc(var(--gutter) - 8.5px); top: 113.5px; bottom: 89.5px; border-radius: var(--r-card); background: var(--ground); overflow: hidden; }
  /* Inner area: 8.5 px bezel on every side, inner radius concentric with the card (34 - 8.5). */
  .in { position: absolute; inset: 8.5px; border-radius: calc(var(--r-card) - 8.5px); overflow: hidden; background: var(--ground); }
  .shot { position: absolute; left: -10px; top: -10px; }
  .shot svg { display: block; }
  .shade { position: absolute; inset: 0; background: radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--ground) 60%, transparent), transparent 50%); }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(11,10,9,.35) 0%, transparent 22%, transparent 55%, rgba(11,10,9,.5) 100%); }

  /* The folder panel: surface fill, outline (raised tab) set in script from the reference shape. */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 228px; padding: 22px 20px 20px; background: var(--surface);
    display: flex; flex-direction: column; justify-content: space-between; }
  .meta { display: flex; flex-direction: column; gap: 8px; }
  .kind { display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--events-c); }
  .ttl { font-size: 20px; }
  .when { display: flex; align-items: baseline; justify-content: space-between; }
  .date { display: flex; align-items: baseline; gap: 6px; }
</style>
</head><body>
<div class="phone">
  <div class="card">
    <div class="in">
      <div class="shot" id="shot"></div>
      <div class="shade"></div>
      <div class="glow"></div>
      <div class="panel" id="panel">
        <div class="meta">
          <div class="kind"><i class="dot"></i><span class="t-label">EVENT</span></div>
          <div class="t-title ttl">Mallrat at the Enmore</div>
          <div class="t-body">Sun 11 Oct · Doors 7pm</div>
        </div>
        <div class="when">
          <div class="date"><span class="t-num-l">11</span><span class="t-unit">Oct</span></div>
          <span class="t-label dim">2 SCREENSHOTS</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const phone = document.querySelector('.phone');
    const header = `<div style="position:absolute;top:62px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:60"><span class="btn-circle">${icon('x',20)}</span><span class="t-nav">Tonight's recap</span><span style="flex:1"></span><span class="t-label dim">1 / 4</span></div>`;
    const decide = `<div class="seg" style="position:absolute;left:var(--gutter);right:var(--gutter);bottom:24px;z-index:70"><div class="seg-btn primary">${icon('bookmark',18)}Still want</div><div class="seg-btn">${icon('x',18)}Drop</div><div class="seg-btn">${icon('check',18)}Done</div></div>`;
    phone.insertAdjacentHTML('afterbegin', statusBar(true) + header + decide);

    // Screenshot covers the inner area with a 10 px overscan so the blur has no edges.
    const inEl = document.querySelector('.in');
    const { width: W, height: H } = inEl.getBoundingClientRect();
    const R = parseFloat(getComputedStyle(inEl).borderTopLeftRadius);
    document.getElementById('shot').innerHTML = screenshot('event', W + 20, H - 140, { hero: true, blurX: 14, blurY: 5 });

    // Folder outline: the reference tab (328 wide, 228 tall panel), scaled to the measured width.
    const panel = document.getElementById('panel');
    const P = panel.offsetHeight, s = W / 328, x = v => (v * s).toFixed(2);
    panel.style.clipPath = `path('M0 16 Q0 0 16 0 L${x(190)} 0 Q${x(207)} 0 ${x(213)} 10 L${x(230)} 24 Q${x(234)} 28 ${x(240)} 28 L${x(313)} 28 Q${W} 28 ${W} 43 L${W} ${P - R} Q${W} ${P} ${W - R} ${P} L${R} ${P} Q0 ${P} 0 ${P - R} Z')`;
  </script>
  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
</body></html>
