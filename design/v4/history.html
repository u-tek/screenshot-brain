<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  /* Score card: places gradient glass, same layout as the Your Energy card, built at real pixels. */
  .score { position: absolute; left: 16px; top: 122px; width: 361px; height: 213px; border-radius: var(--r-card); overflow: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--places-d) 88%, transparent) 0%, color-mix(in srgb, var(--places-c) 80%, transparent) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.22), 0 24px 48px rgba(0,0,0,.3);
    -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); }
  .score > * { position: absolute; white-space: nowrap; }
  .score .s-sub { left: 30px; top: 36px; }
  .score .s-score { right: 30px; top: 33px; }
  .score .s-bar { left: 30px; right: 30px; top: 98px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.18); overflow: hidden; }
  .s-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 26.1%; border-radius: 13px; background: #fff; }
  .score .s-ring { top: 148px; width: 33px; height: 33px; }
  .score .s-lbl { top: 142px; }
  .score .s-num { top: 160px; font-size: 30px; }
  .unit-dim { color: var(--ink-2); }

  /* Timeline card: glass with a folder tab, built at real pixels (361 x 412, corners 34). */
  .tl { position: absolute; left: 16px; top: 375px; width: 361px; height: 412px; }
  .tl-shape { position: absolute; inset: 0; }
  .tl-rim { position: absolute; left: 0; top: 0; }
  .tl-tab { position: absolute; left: 0; right: 0; top: 12px; text-align: center; }
  .tl-head { position: absolute; left: 25px; right: 25px; top: 62px; height: 24px; display: flex; align-items: center; justify-content: space-between; }
  .tl-head .grp { display: flex; align-items: center; gap: 16px; }
  .tl-yr { position: absolute; left: 25px; top: 276px; }

  /* Month cells: glass, darker for the months that did not get a check. */
  .cell { position: absolute; width: 49px; height: 72px; border-radius: 14px; }
  .cell.dk { background: color-mix(in srgb, var(--ground) 40%, transparent); border-color: rgba(255,255,255,.08); }
  .cell-l { position: absolute; left: 0; right: 0; top: 10px; text-align: center; }
  .dot { position: absolute; left: 14.5px; top: 43px; width: 20px; height: 20px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; }
  .dot.dk { background: var(--surface-2); }
  .xmark { position: absolute; left: 19.5px; top: 47px; }

  /* The three-way decision row sits at the bottom of the timeline card. */
  .tl .seg { position: absolute; left: 8px; right: 8px; bottom: 8px; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
  .tl .seg .primary { flex: 1.3; }
</style></head>
<body>
<div class="phone">
  <!-- Ground with dim lights: a places glow upper left behind the score, a deep events glow lower down behind the timeline. -->
  <div class="light" style="left:-90px;top:40px;width:280px;height:280px;background:var(--places-c);opacity:.4"></div>
  <div class="light" style="left:120px;top:560px;width:320px;height:320px;background:var(--events-d);opacity:.6"></div>

  <div class="score">
    <div class="t-body s-sub">Two more than last week</div>
    <div class="t-num-l s-score">6<span class="t-unit unit-dim">/23</span></div>
    <div class="s-bar"><div class="s-fill"></div></div>

    <svg class="s-ring" style="left:44px" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16.5" fill="none" style="stroke:rgba(255,255,255,.18)" stroke-width="7"/>
      <circle cx="20" cy="20" r="16.5" fill="none" style="stroke:var(--lime)" stroke-width="7" stroke-linecap="round" stroke-dasharray="49.6 103.7" transform="rotate(-90 20 20)"/></svg>
    <div class="t-title s-lbl" style="left:87px">Kept</div>
    <div class="t-num-l s-num" style="left:87px">11<span class="t-unit unit-dim">/23</span></div>

    <svg class="s-ring" style="left:195px" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16.5" fill="none" style="stroke:rgba(255,255,255,.18)" stroke-width="7"/>
      <circle cx="20" cy="20" r="16.5" fill="none" style="stroke:var(--lime)" stroke-width="7" stroke-linecap="round" stroke-dasharray="27.1 103.7" transform="rotate(-90 20 20)"/></svg>
    <div class="t-title s-lbl" style="left:241px">Done</div>
    <div class="t-num-l s-num" style="left:241px">6<span class="t-unit unit-dim">/23</span></div>
  </div>

  <div class="tl">
    <div class="glass tl-shape" style="clip-path:path('M0 72 Q0 38 34 38 L95.5 38 C111.8 38 117.2 0 135.7 0 L225.3 0 C243.8 0 249.2 38 265.5 38 L327 38 Q361 38 361 72 L361 378 Q361 412 327 412 L34 412 Q0 412 0 378 Z')"></div>
    <svg class="tl-rim" width="361" height="412" viewBox="0 0 361 412"><path d="M0 72 Q0 38 34 38 L95.5 38 C111.8 38 117.2 0 135.7 0 L225.3 0 C243.8 0 249.2 38 265.5 38 L327 38 Q361 38 361 72 L361 378 Q361 412 327 412 L34 412 Q0 412 0 378 Z" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1"/></svg>
    <div class="t-label tl-tab">Recaps</div>
    <div class="tl-head"><span class="t-nav">2026</span><span class="grp"><span class="t-body">First recap</span><span class="t-label">03.02.2026</span></span></div>
    <div class="t-nav tl-yr">2027</div>
    <div id="tlCells"></div>
  </div>

  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const phone = document.querySelector('.phone');
  phone.insertAdjacentHTML('afterbegin', statusBar(true));
  phone.insertAdjacentHTML('beforeend', `
    <div style="position:absolute;top:62px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:60">
      <span class="btn-circle">${icon('back', 20)}</span><span class="t-nav">Your score</span>
    </div>`);

  // Checks are lime circles with dark ticks; crosses are dim.
  const X_SVG = (cls, color, size) => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" style="stroke:${color}" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const CHECK = `<svg width="10" height="10" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" style="stroke:var(--ground)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  // Year 2026: Jan to Dec. ok = check, no = dim x in a dark circle, miss = bare dim x.
  const y26 = [['Jan', ''], ['Feb', 'ok'], ['Mar', 'ok'], ['Apr', 'ok'], ['May', 'no'], ['Jun', 'ok'],
               ['Jul', 'ok'], ['Aug', 'ok'], ['Sep', 'miss'], ['Oct', 'ok'], ['Nov', ''], ['Dec', '']];
  const y27 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];

  const cell = (x, y, label, mark, dark) => {
    let m = '';
    if (mark === 'ok') m = `<div class="dot">${CHECK}</div>`;
    if (mark === 'no') m = `<div class="dot dk">${X_SVG('', 'var(--ink-3)', 9)}</div>`;
    if (mark === 'miss') m = X_SVG('xmark', 'var(--ink-3)', 10);
    return `<div class="cell glass${dark ? ' dk' : ''}" style="left:${x}px;top:${y}px"><span class="t-label cell-l${dark ? ' dim' : ''}">${label}</span>${m}</div>`;
  };
  const PITCH = 52.3, X0 = 25;
  let html = '';
  y26.forEach(([l, mk], i) => {
    const col = i % 6, row = Math.floor(i / 6);
    html += cell(X0 + col * PITCH, 97 + row * 74, l, mk, mk === 'no' || mk === 'miss');
  });
  y27.forEach((l, i) => {
    html += cell(X0 + (i % 6) * PITCH, 309, l, '', false);
  });
  document.getElementById('tlCells').insertAdjacentHTML('beforeend', html);

  // Decision row: primary Start recap with an arrow, then History and Settings.
  document.querySelector('.tl').insertAdjacentHTML('beforeend', `
    <div class="seg">
      <div class="seg-btn primary">Start recap${icon('arrow', 18)}</div>
      <div class="seg-btn">History</div>
      <div class="seg-btn">Settings</div>
    </div>`);
</script>
</body></html>
