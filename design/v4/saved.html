<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  html, body { background: var(--ground); }

  /* Header row at y 62: a round button, the centred title, a round button. */
  .hdr { position: absolute; top: 62px; left: var(--gutter); right: var(--gutter); display: flex; align-items: center; justify-content: space-between; z-index: 60; }
  .hdr .t-large { flex: 1; text-align: center; }

  /* Tile grid from y 122: 16pt gutters, 8pt gaps. Rows 200 / 200 / 194 end at y 732, above the tab bar (top 764). */
  .grid { position: absolute; top: 122px; left: var(--gutter); right: var(--gutter); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 200px 200px 194px; gap: var(--gap); }
  .recipes { grid-column: 1 / span 2; }

  /* One light per tile: a wide ellipse centred on the top edge. Full core colour across the top, then the deep edge, then the surface. */
  .light { left: -60%; right: -60%; top: -100px; height: 200px; background: radial-gradient(ellipse closest-side, var(--c) 0%, var(--c) 40%, var(--d) 75%, transparent 100%); }

  .lbl { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 2; text-align: center; white-space: nowrap; }
</style>
</head><body>
<div class="phone" id="phone">
  <div class="hdr">
    <span class="btn-circle" data-icon="sliders"></span>
    <span class="t-large">Saved</span>
    <span class="btn-circle" data-icon="search"></span>
  </div>

  <div class="grid">
    <div class="tile places"><div class="light" style="--c: var(--places-c); --d: var(--places-d)"></div><div class="t-label lbl">PLACES <span class="t-label dim">· 9</span></div></div>
    <div class="tile events"><div class="light" style="--c: var(--events-c); --d: var(--events-d)"></div><div class="t-label lbl">EVENTS <span class="t-label dim">· 14</span></div></div>
    <div class="tile reference"><div class="light" style="--c: var(--reference-c); --d: var(--reference-d)"></div><div class="t-label lbl">REFERENCE <span class="t-label dim">· 23</span></div></div>
    <div class="tile products"><div class="light" style="--c: var(--products-c); --d: var(--products-d)"></div><div class="t-label lbl">PRODUCTS <span class="t-label dim">· 6</span></div></div>
    <div class="tile recipes"><div class="light" style="--c: var(--recipes-c); --d: var(--recipes-d)"></div><div class="t-label lbl">RECIPES <span class="t-label dim">· 4</span></div></div>
  </div>

  <div class="tabbar">
    <div class="tab" data-icon="home">Home</div>
    <div class="tab on" data-icon="bookmark">Saved</div>
    <div class="tab" data-icon="spark">Reveals</div>
  </div>

  <div class="home-indicator"></div>
  <div class="grain"></div>
</div>
<script>
  const ph = document.getElementById('phone');
  ph.insertAdjacentHTML('afterbegin', statusBar(true));
  // width="13" height="13" viewBox="0 0 13 13"><g style="fill:var(--ink-2)"><circle cx="1.75" cy="1.75" r="1.75"/><circle cx="11.25" cy="1.75" r="1.75"/><circle cx="1.75" cy="11.25" r="1.75"/><circle cx="11.25" cy="11.25" r="1.75"/></g></svg>';
  document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, 20)));
</script>
</body></html>
