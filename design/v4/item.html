<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  /* Opened screen: the ground alone, the header at y 62, one hero tile, then the actions. Layout only; materials come from system.css. */
  .hdr { position: absolute; top: 62px; left: var(--gutter); right: var(--gutter); display: flex; align-items: center; gap: 14px; z-index: 60; }
  .ident { position: absolute; top: 122px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .ident .big { font-size: 52px; margin-top: 8px; white-space: nowrap; }
  .ident .sub { margin-top: 4px; }

  .hero { position: absolute; top: 262px; left: var(--gutter); right: var(--gutter); height: 300px; }
  .hero .light { left: 50%; top: 134px; width: 200px; height: 240px; transform: translate(-50%, -50%); background: var(--events-c); opacity: .5; }
  .shot { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: 132px; height: 236px; border-radius: 18px; overflow: hidden; z-index: 1;
    box-shadow: 0 16px 34px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12); }
  .shot svg { width: 132px; height: 236px; }
  .stamp { position: absolute; left: 0; right: 0; top: 252px; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }

  .do { position: absolute; top: 580px; left: 0; right: 0; text-align: center; }

  .actions { position: absolute; top: 620px; left: var(--gutter); right: var(--gutter); display: flex; flex-direction: column; gap: var(--gap); }
  .actions .pair { display: flex; gap: var(--gap); }
  .actions .pair > .scenario { flex: 1; }
</style></head>
<body>
<div class="phone" id="screen"></div>
<script>
  const s = document.getElementById('screen');
  s.innerHTML = `
    <div class="grain"></div>
    ${statusBar(true)}

    <div class="hdr">
      <span class="btn-circle">${icon('back',20)}</span>
      <span style="flex:1"></span>
      <span class="btn-circle">${icon('more',20)}</span>
    </div>

    <div class="ident">
      <div style="color:var(--events-c);display:flex">${icon('ticket',36)}</div>
      <div class="t-large big">Mallrat</div>
      <div class="t-body sub">at the Enmore</div>
    </div>

    <div class="tile hero">
      <div class="light"></div>
      <div class="shot">${screenshot('event', 132, 236, {sharp: true})}</div>
      <div class="stamp"><span class="t-label">SUN 11 OCT · 8PM</span></div>
    </div>

    <div class="t-nav do">Do it</div>

    <div class="actions">
      <div class="scenario" style="--c: var(--events-c)">CALENDAR</div>
      <div class="scenario fill" style="--c: var(--events-c); background: linear-gradient(90deg, var(--events-c), var(--places-c))">MAPS</div>
      <div class="pair">
        <div class="scenario" style="--c: var(--products-c)">SEND</div>
        <div class="scenario" style="--c: var(--lime)">DONE</div>
      </div>
    </div>

    <div class="home-indicator"></div>
  `;
</script>
</body></html>
