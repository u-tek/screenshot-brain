<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<title>Widget</title>
<style>
  /* Folder art: the reference's 1200-unit square at 0.795 (361pt folder, 16pt gutters), drawn as one SVG
     so the shape is unchanged. Type, the glass card and the controls sit at phone scale, so the system's
     type sizes render at their nominal size. */
  .art { position: absolute; left: -280.5px; top: -51px; width: 954px; height: 954px; overflow: visible; }
  .caps { position: absolute; left: var(--gutter); right: var(--gutter); top: 205px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; line-height: 1; }
  .abs { position: absolute; white-space: nowrap; }
  .ctr { position: absolute; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); }
  .card { position: absolute; left: 15.7px; top: 343px; width: 360px; height: 100.5px; border-radius: 24px; }
  .thumb { position: absolute; left: 55px; top: 352px; width: 83px; height: 83px; border-radius: 9.5px; overflow: hidden; }
  .thumb svg { display: block; }
  .lyrics { position: absolute; left: 154.4px; top: 378px; width: 231px; height: 61px; white-space: nowrap;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 42%, #000 58%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 42%, #000 58%, transparent 100%); }
  .lyrics div { color: var(--lime); }
  .time { color: var(--ground); }
  .time .pm { font-size: 11px; letter-spacing: 0; vertical-align: 6px; }
  .badge { width: 14.3px; height: 14.3px; border-radius: 50%; background: var(--lime); color: var(--ground); }
  .go { width: 35px; height: 35px; border-radius: 50%; background: var(--lime); color: var(--ground); }
  .ctl { color: var(--ink-2); }
  .pill { position: absolute; left: 50%; top: 625px; transform: translateX(-50%); padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  /* Two soft lights on the ground: events deep upper left, products deep lower right. */
  .glow-a { left: -120px; top: -100px; width: 320px; height: 320px; background: var(--events-d); opacity: .5; }
  .glow-b { left: 170px; top: 540px; width: 350px; height: 350px; background: var(--products-d); opacity: .5; }
</style></head>
<body>
<div class="phone">
  <div class="light glow-a"></div>
  <div class="light glow-b"></div>

  <!-- folder: lime tab behind the dark body, which has one soft step at the top right -->
  <svg class="art" viewBox="0 0 1200 1200" aria-hidden="true">
    <defs>
      <filter id="lime" x="-20%" y="-60%" width="140%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" style="flood-color:var(--lime)" flood-opacity=".5"/></filter>
      <filter id="body" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    </defs>
    <path d="M600 446 H752 C774 446 798 468 798 495 H600 Z" style="fill:var(--lime)" filter="url(#lime)"/>
    <path d="M372 473 A56 56 0 0 1 428 417 H618 C628 417 645 433 652 452 C657 472 688 495 706 495 H791 A35 35 0 0 1 826 530 V727 A55 55 0 0 1 771 782 H427 A55 55 0 0 1 372 727 Z" style="fill:var(--surface)" filter="url(#body)"/>
    <!-- progress: lime to the knob, a 15% white track to the end -->
    <line x1="421" y1="687.5" x2="778" y2="687.5" style="stroke:rgba(255,255,255,.15)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="421" y1="687.5" x2="531" y2="687.5" style="stroke:var(--lime)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="531" cy="687.5" r="5" style="fill:var(--lime)"/>
  </svg>

  <!-- the mark, lime -->
  <span class="mark abs" id="mark" style="left:70px; top:302px; color:var(--lime)"></span>

  <!-- time on the lime tab, PM as a superscript, Inter 600 -->
  <div class="t-title abs time" style="left:269px; top:311px">9:30<span class="pm">PM</span></div>

  <!-- glass card, with the recap and the lyric -->
  <div class="glass card"></div>
  <div class="thumb" id="thumb"></div>
  <div class="t-label abs" style="left:148px; top:351px">&bull;&nbsp;TONIGHT'S RECAP</div>
  <div class="lyrics t-title"><div>That gig you saved</div><div>is Friday. Still going?</div><div>That gig you saved</div></div>
  <span class="ctr badge" style="left:330.1px; top:360.4px" id="badge"></span>

  <!-- title and caption -->
  <div class="t-title abs" style="left:0; width:393px; text-align:center; top:449px">Mallrat at the Enmore</div>
  <div class="t-body abs" style="left:0; width:393px; text-align:center; top:468px">Event &middot; Enmore Theatre</div>

  <!-- progress labels -->
  <div class="t-label dim abs" style="left:54px; top:499px">3</div>
  <div class="t-label dim abs" style="right:55px; top:499px">7</div>

  <!-- controls: close where previous was, lime centre with a check, arrow where next was -->
  <span class="ctr ctl" style="left:122.1px; top:531.7px" id="ctl-x"></span>
  <span class="ctr go" style="left:196.5px; top:531.7px" id="ctl-go"></span>
  <span class="ctr ctl" style="left:271.6px; top:531.7px" id="ctl-arrow"></span>

  <!-- bottom caption pill -->
  <div class="pill"><span class="t-label">SCREENSHOT BRAIN</span></div>

  <!-- top captions: evenly spaced across the 16pt gutters, one row -->
  <div class="caps"><span class="t-label dim">WIDGET</span><span class="t-label dim">TONIGHT</span><span class="t-label dim">HOME SCREEN</span></div>

  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const ph = document.querySelector('.phone');
  ph.insertAdjacentHTML('afterbegin', statusBar(true));
  document.getElementById('mark').innerHTML = icon('bracket', 18) + 'Screenshot Brain';
  document.getElementById('thumb').innerHTML = screenshot('event', 83, 83, { sharp: true });
  document.getElementById('badge').innerHTML = icon('check', 12);
  document.getElementById('ctl-x').innerHTML = icon('x', 40);
  document.getElementById('ctl-go').innerHTML = icon('check', 24);
  document.getElementById('ctl-arrow').innerHTML = icon('arrow', 36);
</script>
</body></html>
