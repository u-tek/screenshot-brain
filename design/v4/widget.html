<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<title>Widget</title>
<style>
  /* Folder art: the reference's 1200-unit square at 0.795 (361pt folder, 16pt gutters), drawn as one SVG
     so the shape is unchanged. Type, the glass card and the controls sit at phone scale, so the system's
     type sizes render at their nominal size. */
  .art { position: absolute; left: -279.7px; top: -51px; width: 954px; height: 954px; overflow: visible; }
  .caps { position: absolute; left: var(--gutter); right: var(--gutter); top: 205px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; line-height: 1; }
  .abs { position: absolute; white-space: nowrap; }
  .ctr { position: absolute; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); }
  .card { position: absolute; left: 16px; top: 343px; width: 361px; height: 100.5px; border-radius: 24px; }
  .thumb { position: absolute; left: 55px; top: 352px; width: 83px; height: 83px; border-radius: 9.5px; overflow: hidden; }
  .thumb svg { display: block; }
  .lyrics { position: absolute; left: 148px; top: 374px; width: 200px; white-space: nowrap; line-height: 1.3; }
  .time { color: var(--ground); }
  .time .pm { font-size: 11px; letter-spacing: 0; vertical-align: 6px; }
  .badge { width: 14.3px; height: 14.3px; border-radius: 50%; background: var(--lime); color: var(--ground); }
  .go { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: var(--ground); }
  .ctl { color: var(--ink-2); }
  .pill { position: absolute; left: 50%; top: 649px; transform: translateX(-50%); padding: 2px 12px 6px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  /* One soft, even light on the ground, centred behind the widget. */
  .glow-a { left: -40px; top: 190px; width: 473px; height: 473px; background: var(--places-d); opacity: .3; }
</style></head>
<body>
<div class="phone">
  <div class="light glow-a"></div>

  <!-- folder: lime tab behind the dark body, which has one soft step at the top right -->
  <svg class="art" viewBox="0 0 1200 1200" aria-hidden="true">
    <defs>
      <filter id="lime" x="-20%" y="-60%" width="140%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" style="flood-color:var(--lime)" flood-opacity=".5"/></filter>
      <filter id="body" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    </defs>
    <path d="M600 446 H752 C774 446 798 468 798 495 H600 Z" style="fill:var(--lime)" filter="url(#lime)"/>
    <path d="M372 473 A56 56 0 0 1 428 417 H618 C628 417 645 433 652 452 C657 472 688 495 706 495 H791 A35 35 0 0 1 826 530 V757 A55 55 0 0 1 771 812 H427 A55 55 0 0 1 372 757 Z" style="fill:var(--surface)" filter="url(#body)"/>
    <!-- progress: lime to the knob (1 of 4 = 25%), a 15% white track to the end -->
    <line x1="421" y1="700.6" x2="778" y2="700.6" style="stroke:rgba(255,255,255,.15)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="421" y1="700.6" x2="510" y2="700.6" style="stroke:var(--lime)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="510" cy="700.6" r="5" style="fill:var(--lime)"/>
  </svg>

  <!-- the mark, lime -->
  <span class="mark abs" id="mark" style="left:55px; top:302px; color:var(--lime)"></span>

  <!-- time on the lime tab, PM as a superscript, Inter 600 -->
  <div class="t-title abs time" style="left:269px; top:311px">9:30<span class="pm">PM</span></div>

  <!-- glass card, with the recap and the lyric -->
  <div class="glass card"></div>
  <div class="thumb" id="thumb"></div>
  <div class="t-label abs" style="left:148px; top:351px"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--events-c);box-shadow:0 0 8px var(--events-c);margin-right:8px;vertical-align:1px"></i>TONIGHT’S RECAP</div>
  <div class="lyrics t-title"><div>That gig is this Sunday.</div><div style="color:var(--ink-2)">Still going?</div></div>
  <span class="ctr badge" style="left:330.1px; top:360.4px" id="badge"></span>

  <!-- title and caption -->
  <div class="t-title abs" style="left:0; width:393px; text-align:center; top:451px">Mallrat at the Enmore</div>
  <div class="t-body abs" style="left:0; width:393px; text-align:center; top:474px">Event &middot; Enmore Theatre</div>

  <!-- progress labels -->
  <div class="t-label dim abs" style="left:54px; top:514px">1 / 4</div>
  <div class="t-label dim abs" style="right:55px; top:514px">3 LEFT</div>

  <!-- controls: the recap's three decisions, drop (x), done (check, filled) and still want (bookmark) -->
  <span class="ctr ctl" style="left:121.5px; top:556px" id="ctl-x"></span>
  <span class="ctr go" style="left:196.5px; top:556px" id="ctl-go"></span>
  <span class="ctr ctl" style="left:271.5px; top:556px" id="ctl-keep"></span>

  <!-- bottom caption pill -->
  <div class="pill"><span class="t-label dim">HOME SCREEN · MEDIUM</span></div>

  <!-- top captions: evenly spaced across the 16pt gutters, one row -->

  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const ph = document.querySelector('.phone');
  ph.insertAdjacentHTML('afterbegin', statusBar(true));
  document.getElementById('mark').innerHTML = icon('bracket', 18) + 'Screenshot Brain';
  document.getElementById('thumb').innerHTML = screenshot('event', 83, 83, { hero: true, sharp: true });
  document.getElementById('badge').innerHTML = icon('check', 12);
  document.getElementById('ctl-x').innerHTML = icon('x', 24);
  document.getElementById('ctl-go').innerHTML = icon('bookmark', 22);
  document.getElementById('ctl-keep').innerHTML = icon('check', 24);
</script>
</body></html>
