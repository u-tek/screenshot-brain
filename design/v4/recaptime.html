<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  .abs { position: absolute; white-space: nowrap; line-height: 1; }
  /* One warm surface, a deep well of light in the middle where the time sits. */
  .card { position: absolute; left: var(--gutter); right: var(--gutter); top: 122px; height: 704px; border-radius: 44px; overflow: hidden;
    --card: color-mix(in srgb, var(--ramp-4) 62%, var(--ramp-6)); --deep: var(--ramp-1);
    background: radial-gradient(120% 70% at 50% 100%, color-mix(in srgb, var(--card) 85%, var(--ramp-3)), var(--card) 60%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 30px 60px rgba(0,0,0,.4); }
  .well { position: absolute; left: 50%; top: 232px; width: 360px; height: 420px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, var(--ground) 0%, color-mix(in srgb, var(--deep) 60%, var(--ground)) 30%, var(--deep) 46%,
      color-mix(in srgb, var(--ramp-3) 70%, var(--deep)) 64%, color-mix(in srgb, var(--card) 80%, var(--ramp-3)) 84%, var(--card) 100%); filter: blur(6px); }
  .card > * { position: absolute; }
  .label { left: 28px; top: 40px; color: #1d0e08; }
  .toggle { right: 24px; top: 30px; width: 64px; height: 38px; border-radius: 19px; background: #1d0e08; }
  .toggle i { position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--ramp-7); }
  .big { left: 0; right: 0; text-align: center; top: 176px; }
  .unit { left: 0; right: 0; text-align: center; top: 282px; color: rgba(246,236,226,.7); }
  .ruler { left: 40px; right: 40px; top: 322px; height: 36px; }
  .ruler span { position: absolute; top: 7px; width: 1px; height: 22px; background: rgba(246,236,226,.4); }
  .ruler span.maj { top: 0; height: 36px; width: 1.5px; background: rgba(246,236,226,.7); }
  .ruler span.now { top: -4px; height: 44px; width: 3px; border-radius: 1.5px; background: var(--accent); box-shadow: 0 0 10px rgba(246,236,226,.8); }
  .foot { left: 28px; right: 28px; top: 440px; display: flex; justify-content: space-between; align-items: center; color: #1d0e08; }
  .knob { width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, color-mix(in srgb, var(--deep) 70%, transparent) 40%, transparent 70%); }
  .knob b { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, var(--ramp-7) 60%, var(--ramp-6));
    box-shadow: 0 6px 14px rgba(29,14,8,.45), inset 0 -2px 3px rgba(29,14,8,.15); position: relative; }
  .knob b::after { content: ""; position: absolute; left: 23px; top: 7px; width: 4px; height: 10px; border-radius: 2px; background: rgba(29,14,8,.4); }
  .days { left: 28px; right: 28px; top: 552px; display: flex; justify-content: space-between; }
  .days span { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 500 14px Inter; color: #1d0e08; border: 1px solid rgba(29,14,8,.25); }
  .days span.on { background: #1d0e08; color: var(--ramp-7); border-color: #1d0e08; }
</style>
</head><body>
<div class="phone" id="p">
  <div class="card">
    <div class="well"></div>
    <div class="t-nav label">Nightly recap</div>
    <div class="toggle"><i></i></div>
    <div class="t-num-xl big" style="font-size:104px">9:30</div>
    <div class="t-unit unit">pm</div>
    <div class="ruler" id="ruler"></div>
    <div class="foot">
      <div><div class="t-label" style="color:#1d0e08">WEEKNIGHTS</div><div class="t-body" style="color:rgba(29,14,8,.7);margin-top:6px">About two minutes</div></div>
      <div class="knob"><b></b></div>
    </div>
    <div class="days" id="days"></div>
  </div>
  <div style="position:absolute;left:0;right:0;top:748px;display:flex;justify-content:center;z-index:5"><div class="cta" id="cta" style="background:#1d0e08">Set recap time</div></div>
  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const p = document.getElementById('p');
  p.insertAdjacentHTML('afterbegin', statusBar(true) +
    `<div style="position:absolute;top:62px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:60"><span class="btn-circle">${icon('back', 20)}</span><span class="t-nav">Your recap</span></div>`);
  document.getElementById('cta').insertAdjacentHTML('beforeend', `<span class="go">${icon('check', 18)}</span>`);
  // Ruler: quarter hours either side of 9:30, the hours taller, fading towards the edges.
  const R = document.getElementById('ruler'), w = 281; let h = '';
  for (let k = -12; k <= 12; k++) {
    const x = w / 2 + k * 11, op = 1 - .7 * Math.pow(Math.abs(k) / 12, 2);
    h += `<span class="${k === 0 ? 'now' : (k + 2) % 4 === 0 ? 'maj' : ''}" style="left:${x - (k === 0 ? 1.5 : .5)}px;opacity:${k === 0 ? 1 : op.toFixed(2)}"></span>`;
  }
  R.innerHTML = h;
  document.getElementById('days').innerHTML = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => `<span class="${i < 5 ? 'on' : ''}">${d}</span>`).join('');
</script>
</body></html>
