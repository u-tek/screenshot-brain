<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="kit.js"></script>
<style>
  .phone { font-family: "Inter", system-ui, sans-serif; }
  .abs { position: absolute; white-space: nowrap; line-height: 1; }
  .island { position: absolute; left: 134px; top: 13px; width: 125px; height: 37px; border-radius: 18.5px; background: #1a1a1a; }
  .back { position: absolute; left: 29px; top: 71px; width: 49px; height: 49px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .title { left: 101px; top: 86px; font-size: 22px; font-weight: 400; letter-spacing: -0.3px; color: #f4f3f1; }

  .card { position: absolute; left: 6px; top: 141px; width: 381px; height: 704px; border-radius: 62px; background: #c8a1c0; overflow: hidden; }
  .glow { position: absolute; left: 5.5px; top: 28px; width: 370px; height: 436px;
    background: radial-gradient(185px 218px at 50% 50%,
      #2e0019 0%, #3a0a29 12%, #4a0c35 25%, #741746 30%, #992258 36%, #b22863 41%, #be2e6b 47%,
      #c53276 52%, #cc3c84 58%, #d14993 63%, #d3579d 68%, #d265a6 74%, #cf74ad 79%, #cd7faf 85%,
      #cb89b4 90%, #ca91ba 95%, #c8a1c0 100%); }

  .label { left: 51px; top: 197px; font-size: 22px; font-weight: 400; letter-spacing: -0.3px; color: #f4f3f1; }
  .toggle { position: absolute; left: 253px; top: 187px; width: 89px; height: 44px; border-radius: 22px; background: #8e637f; }
  .toggle .on { position: absolute; left: 14px; top: 15.5px; font-size: 15px; font-weight: 400; color: #fff; line-height: 1; }
  .toggle .tknob { position: absolute; left: 53px; top: 7px; width: 29px; height: 29px; border-radius: 50%; background: #fff; }

  .big { left: 0; width: 393px; text-align: center; top: 348px; font-family: "Inter Display", "Inter", system-ui, sans-serif; font-size: 80px; font-weight: 300; letter-spacing: -2px; color: #fff; }
  .unit { left: 0; width: 393px; text-align: center; top: 445px; font-size: 18px; font-weight: 400; color: #fff; }

  .tick { position: absolute; top: 475.6px; height: 36px; width: 1.5px; background: rgba(255,255,255,.55); }
  .tick.minor { top: 482.6px; height: 22px; width: 1px; background: rgba(255,255,255,.3); }
  .yellow { position: absolute; left: 195px; top: 475.6px; width: 3px; height: 36px; border-radius: 1.5px; background: #ffdf7a; }

  .pd { position: absolute; border-radius: 50%; background: #fff; }

  .day { left: 50px; top: 631.8px; font-size: 17px; font-weight: 400; color: #fff; }
  .date { left: 50px; top: 664.6px; font-family: "Inter Display", "Inter", system-ui, sans-serif; font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.4); }
  .mk { position: absolute; left: 115.8px; width: 29px; height: 29px; }
  .val { font-size: 18px; font-weight: 400; color: #fff; left: 158px; }

  .dial-halo { position: absolute; left: 247.2px; top: 609px; width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(60,8,40,.95) 0, rgba(92,22,66,.92) 26px, rgba(120,45,95,.6) 36px, rgba(120,45,95,.3) 41px, rgba(120,45,95,0) 48px); }
  .dial-svg { position: absolute; left: 247.2px; top: 609px; width: 100px; height: 100px; }
  .dknob { position: absolute; left: 274.2px; top: 636px; width: 46px; height: 46px; border-radius: 50%; background: #f7f6f6; }
  .dknob::after { content: ""; position: absolute; left: 20.5px; top: 20.5px; width: 4px; height: 4px; border-radius: 50%; background: rgba(40,20,35,.45); }

  .pill { position: absolute; left: 99px; top: 762px; width: 195px; height: 49px; border-radius: 24.5px; background: #8b7287; }
  .pill .txt { position: absolute; left: 30px; top: 16.5px; font-size: 15px; font-weight: 400; letter-spacing: -0.4px; color: #f4f3f1; line-height: 1; white-space: nowrap; }
  .pill .plus { position: absolute; left: 155.6px; top: 8.6px; width: 32px; height: 32px; border-radius: 50%; background: #fff; }
</style>
</head><body>
<div class="phone">

  <div class="island"></div>
  <div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></div>
  <div class="abs title">Your recap</div>

  <div class="card"><div class="glow"></div></div>

  <div class="abs label">Nightly recap</div>
  <div class="toggle"><div class="on">On</div><div class="tknob"></div></div>

  <div class="abs big">9:30</div>
  <div class="abs unit">pm</div>

  <script>
    (function () {
      var phone = document.querySelector('.phone');
      var html = '';
      // ruler: 24 ticks around a yellow centre marker, pitch 10.5px; majors every 4th
      for (var k = -12; k <= 12; k++) {
        if (k === 0) continue;
        var x = 196.5 + k * 10.5;
        var major = (Math.abs(k) % 4 === 0);
        var op = 1 - 0.55 * Math.pow(Math.abs(k) / 12, 2);
        html += '<div class="tick' + (major ? '' : ' minor') + '" style="left:' + (x - (major ? 0.75 : 0.5)) + 'px;opacity:' + op.toFixed(3) + '"></div>';
      }
      html += '<div class="yellow"></div>';
      // page dots: active first, then three small
      html += '<div class="pd" style="left:178.75px;top:583.15px;width:6.5px;height:6.5px"></div>';
      [191.8, 201.6, 211.4].forEach(function (cx) {
        html += '<div class="pd" style="left:' + (cx - 2) + 'px;top:584.4px;width:4px;height:4px;opacity:.6"></div>';
      });
      // bottom-left block
      html += '<div class="abs day">mon</div>';
      html += '<div class="abs date">14</div>';
      // hour marker (white; hand at 285deg = 21h) and minute marker (pink; hand at 180deg = :30)
      var hr = 285 * Math.PI / 180, hx = 14.5 + Math.sin(hr) * 8.7, hy = 14.5 - Math.cos(hr) * 8.7;
      html += '<svg class="mk" style="top:631.3px" width="29" height="29" viewBox="0 0 29 29"><circle cx="14.5" cy="14.5" r="14.5" fill="#fff"/><line x1="14.5" y1="14.5" x2="' + hx.toFixed(2) + '" y2="' + hy.toFixed(2) + '" stroke="#8b7287" stroke-width="2.4" stroke-linecap="round"/></svg>';
      html += '<svg class="mk" style="top:668.2px" width="29" height="29" viewBox="0 0 29 29"><circle cx="14.5" cy="14.5" r="14.5" fill="#e13a8c"/><line x1="14.5" y1="14.5" x2="14.5" y2="24.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
      html += '<div class="abs val" style="top:635.5px">21</div>';
      html += '<div class="abs val" style="top:672.5px">30</div>';
      // dial: halo, tick ring, knob
      var ticks = '';
      for (var i = 0; i < 36; i++) {
        ticks += '<line x1="50" y1="4" x2="50" y2="10.5" transform="rotate(' + (i * 10) + ' 50 50)"/>';
      }
      html += '<div class="dial-halo"></div>';
      html += '<svg class="dial-svg" viewBox="0 0 100 100"><g stroke="rgba(255,255,255,.66)" stroke-width="1.2" stroke-linecap="round" fill="none">' + ticks + '</g></svg>';
      html += '<div class="dknob"></div>';
      // pill with plus circle
      html += '<div class="pill"><div class="txt">Set recap time</div><div class="plus"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M16 10.5v11M10.5 16h11" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/></svg></div></div>';
      phone.insertAdjacentHTML('beforeend', html);
      phone.insertAdjacentHTML('afterbegin', statusBar(true));
    })();
  </script>

  <div class="home-indicator"></div>
</div>
</body></html>
