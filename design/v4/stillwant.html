<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  /* Opened screen: header at y 62, label at y 118, then the spine stack. Colours come from the five lights. */
  html, body { background: var(--ground); }
  .face { position: absolute; left: 16px; width: 222px; box-sizing: border-box; overflow: hidden; }
  .face .ln { position: absolute; left: 7px; right: 36px; height: .7px; }
  .thumb { position: absolute; left: 207.4px; width: 26.6px; height: 26px; overflow: hidden; }
  .trap { position: absolute; left: 16px; width: 222px; overflow: hidden; }
  .trap .cov { position: absolute; inset: 0; }
  .title { position: absolute; left: 254px; right: var(--gutter); overflow-wrap: break-word; }
  .title .t-title { font-size: 15px; line-height: 1.15; }
  .title .t-body { font-size: 13px; line-height: 1.25; margin-top: 2px; }
  .chev { margin: 2px 0 0 2px; font-size: 13px; line-height: 1; color: var(--ink-2); }
</style>
</head><body>
<div class="phone" id="screen"></div>
<script>
const S = document.getElementById('screen');
const FW = 256.7;                     // reference list face width (pt)

// Per-box geometry, measured from the reference (pt, screen space).
// light: the system light the face and glow take. glow: strength of the glow, % of the bright core.
// faceTop/faceH: the spine face. trap: the cover trapezoid, above or below the face.
const BOXES = [
  { title: 'Ramen Ikkyu', sub: 'Saved 3 weeks ago', light: 'reference', glow: 10, faceTop: 163.2, faceH: 32.2,
    trap: { pos: 'below', top: 195.5, h: 47.5, inset: 28 },
    cover: { kind: 'recipe', filter: 'grayscale(1) sepia(.22) brightness(1.12)', under: 'linear-gradient(180deg,#f0e9e1 0%,#8c847e 42%,#1b181a 78%,#000 100%)' },
    thumb: { kind: 'place', filter: 'hue-rotate(190deg) saturate(.8) brightness(.85)' } },
  { title: "Bar Totti's", sub: 'Saved 5 weeks ago', light: 'events', glow: 90, faceTop: 274.9, faceH: 30.3,
    trap: { pos: 'below', top: 305.2, h: 23.3, inset: 34 },
    cover: { kind: 'place', filter: 'hue-rotate(-24deg) saturate(2.2) brightness(1.1)' },
    thumb: { kind: 'event', filter: 'hue-rotate(20deg) saturate(1.5) brightness(1.1)' } },
  { title: 'Chaco Bar', sub: 'Saved 2 months ago', light: 'products', glow: 35, faceTop: 387.9, faceH: 31.8,
    trap: null,
    cover: null,
    thumb: { kind: 'product', filter: 'hue-rotate(55deg) saturate(1.3)' } },
  { title: 'Lune Croissanterie', sub: 'Saved 2 months ago', light: 'places', glow: 35, faceTop: 498.7, faceH: 32.9,
    trap: { pos: 'above', top: 477.8, h: 20.9, inset: 28 },
    cover: { kind: 'place', filter: 'saturate(.9) brightness(.85)' },
    thumb: { kind: 'place', filter: 'none' } },
  { title: 'Sunday market', sub: 'Saved 3 months ago', light: 'recipes', glow: 18, faceTop: 613.2, faceH: 30.6,
    trap: { pos: 'above', top: 561.6, h: 51.6, inset: 30.5 },
    cover: { kind: 'product', filter: 'saturate(.25) brightness(1.05)' },
    thumb: { kind: 'recipe', filter: 'grayscale(.6) sepia(.4) brightness(.9)' } },
];

// Face: the light's bright core, edged in its deep tone. Glow: the core at a set strength.
function faceOf(light) {
  const c = `var(--${light}-c)`, d = `var(--${light}-d)`;
  return {
    bg: `linear-gradient(180deg, color-mix(in srgb, ${c} 70%, ${d}) 0%, ${c} 16%, ${c} 78%, color-mix(in srgb, ${c} 88%, ${d}) 100%)`,
    edge: d,
    line: `color-mix(in srgb, ${d} 50%, transparent)`,
  };
}
function glowOf(light, pct) { return `color-mix(in srgb, var(--${light}-c) ${pct}%, transparent)`; }

function clipTrap(b) {
  const t = b.trap; const w = FW, h = t.h, i = t.inset;
  if (t.pos === 'below') return `polygon(0 0, ${w}px 0, ${w - i}px ${h}px, ${i}px ${h}px)`;
  return `polygon(${i}px 0, ${w - i}px 0, ${w}px ${h}px, 0 ${h}px)`;
}
function fadeMask(pos) {
  return pos === 'below'
    ? 'linear-gradient(180deg,#000 0%,rgba(0,0,0,.75) 45%,rgba(0,0,0,.25) 80%,transparent 100%)'
    : 'linear-gradient(180deg,transparent 0%,rgba(0,0,0,.35) 45%,#000 100%)';
}

let html = '<div class="grain"></div>';

// Header (opened screen): back, title, filter, at y 62.
html += `<div style="position:absolute;top:62px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:60"><span class="btn-circle">${icon('back',20)}</span><span class="t-nav">Places</span><span style="flex:1"></span><span class="btn-circle">${icon('filter',20)}</span></div>`;
html += `<div class="t-label dim" style="position:absolute;top:118px;left:16px">STILL WANT · 9</div>`;

// The five rows.
BOXES.forEach((b) => {
  const f = faceOf(b.light);
  const glow = glowOf(b.light, b.glow);
  // Cover trapezoid.
  if (b.trap) {
    const t = b.trap;
    let cov = '', under = '';
    if (b.cover && b.cover.under) under = `<div class="cov" style="background:${b.cover.under}"></div>`;
    if (b.cover) {
      cov = `<div class="cov" style="filter:${b.cover.filter}">${screenshot(b.cover.kind, FW, t.h + 4, { blurX: 22, blurY: 10 })}</div>`;
    }
    const bg = `background:linear-gradient(${t.pos === 'below' ? '180deg' : '0deg'}, ${glow} 0%, transparent 100%);`;
    html += `<div class="trap" style="top:${t.top}px;height:${t.h}px;clip-path:${clipTrap(b)};${bg}">
      <div class="cov" style="-webkit-mask-image:${fadeMask(t.pos)};mask-image:${fadeMask(t.pos)}">${under}${cov}</div></div>`;
  }
  // Face (spine) with thin page lines and the cover thumbnail at the right end.
  let lines = '';
  [9.8, 16.4, 23.0, 29.6].forEach(y => { if (y < b.faceH - 2) lines += `<div class="ln" style="top:${y}px;background:${f.line};"></div>`; });
  html += `<div class="face" style="top:${b.faceTop}px;height:${b.faceH}px;background:${f.bg};border:1px solid ${f.edge};">${lines}</div>`;
  const th = b.thumb;
  html += `<div class="thumb" style="top:${b.faceTop + (b.faceH - 26) / 2}px;"><div style="width:26.6px;height:26px;filter:${th.filter}">${screenshot(th.kind, 26.6, 26, { sharp: true })}</div></div>`;
  // Titles (right column): name in t-title, saved-when in t-body, then the chevron.
  html += `<div class="title" style="top:${b.faceTop + 3}px"><div class="t-title">${b.title}</div><div class="t-body">${b.sub}</div><div class="chev">›</div></div>`;
});

html += statusBar(true);
html += `<div class="home-indicator"></div>`;
S.innerHTML = html;
</script>
</body></html>
