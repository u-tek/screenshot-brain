<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="system.css"><script src="kit.js"></script>
<style>
  .abs { position: absolute; white-space: nowrap; }
  .tick { position: absolute; width: 1px; height: 19px; background: rgba(255,255,255,.25); }
</style></head>
<body>
<div class="phone">
  <div class="grain"></div>
  <script>document.currentScript.parentElement.insertAdjacentHTML('afterbegin', statusBar(true));</script>

  <!-- top row: calendar (btn-circle) and five day chips, W selected -->
  <span class="btn-circle abs" style="left:20px;top:73px;"><script>document.currentScript.parentElement.innerHTML = icon('cal', 20);</script></span>
  <div class="chip-circle abs" style="left:80px;top:73px;">M</div>
  <div class="chip-circle abs" style="left:142.25px;top:73px;">T</div>
  <div class="chip-circle on abs" style="left:204.5px;top:73px;">W</div>
  <div class="chip-circle abs" style="left:266.75px;top:73px;">T</div>
  <div class="chip-circle abs" style="left:329px;top:73px;">F</div>

  <!-- score: label, big reading, unit line -->
  <div class="t-nav abs" style="left:0;width:393px;top:146px;text-align:center;">Score</div>
  <div class="t-num-xl abs" style="left:0;width:393px;top:178px;text-align:center;">6</div>
  <div class="t-unit abs" style="left:0;width:393px;top:280px;text-align:center;color:var(--ink-2);">of 23 done</div>

  <!-- wave lines, triangle marker and straight line -->
  <svg class="abs" style="left:0;top:0" width="393" height="852" viewBox="0 0 393 852" id="wave"></svg>
  <script>
    (function () {
      const svg = document.getElementById('wave');
      const cy = 326.0, A = 15.8, P = 95.6, xc = 130.2;
      const wave = (x, shift, amp) => cy - amp * Math.cos(2 * Math.PI * (x - xc - shift) / P);
      const path = (shift, amp) => {
        let d = '';
        for (let x = 0; x <= 194.2; x += 0.5) d += (x ? 'L' : 'M') + x + ' ' + wave(x, shift, amp).toFixed(2) + ' ';
        return d;
      };
      svg.innerHTML = `
        <defs>
          <linearGradient id="fadeW" gradientUnits="userSpaceOnUse" x1="0" x2="80" y1="0" y2="0">
            <stop offset="0" style="stop-color:var(--lime)" stop-opacity="0"/>
            <stop offset="1" style="stop-color:var(--lime)" stop-opacity="1"/>
          </linearGradient>
          <linearGradient id="lineG" gradientUnits="userSpaceOnUse" x1="0" x2="393" y1="0" y2="0">
            <stop offset="${40.6/393}" stop-color="#f4f3f1" stop-opacity=".05"/>
            <stop offset="${60/393}" stop-color="#f4f3f1" stop-opacity=".47"/>
            <stop offset="${100/393}" stop-color="#f4f3f1" stop-opacity=".65"/>
            <stop offset="${150/393}" stop-color="#f4f3f1" stop-opacity=".85"/>
            <stop offset="${185/393}" stop-color="#f4f3f1" stop-opacity=".85"/>
            <stop offset="${200/393}" stop-color="#ffffff" stop-opacity=".93"/>
            <stop offset="${230/393}" stop-color="#f4f3f1" stop-opacity=".76"/>
            <stop offset="${260/393}" stop-color="#f4f3f1" stop-opacity=".58"/>
            <stop offset="${300/393}" stop-color="#f4f3f1" stop-opacity=".34"/>
            <stop offset="${340/393}" stop-color="#f4f3f1" stop-opacity=".1"/>
            <stop offset="${352.4/393}" stop-color="#f4f3f1" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${path(47.8, 15.8)}" fill="none" style="stroke:var(--lime)" stroke-opacity=".42" stroke-width="1"/>
        <path d="${path(0, 15.8)}" fill="none" stroke="url(#fadeW)" stroke-width="1.05"/>
        <rect x="40.6" y="${cy + 3.6}" width="311.8" height="1.3" fill="url(#lineG)"/>
        <path d="M187.35 ${cy - 6.7} L201.05 ${cy - 6.7} L194.2 ${cy + 4.4} Z" style="fill:var(--lime)"/>
      `;
    })();
  </script>

  <!-- bento: 16pt side gutters, 8pt gaps, radius 28 tiles -->
  <!-- Done this week: places to events gradient, lime ring arc -->
  <div class="tile abs" style="left:16px;top:356px;width:361px;height:112px;background:linear-gradient(90deg,var(--places-c),var(--events-c));">
    <div class="t-body abs" style="left:20px;top:16px;color:var(--ink);">Done this week</div>
    <svg class="abs" style="left:253px;top:12px" width="88" height="88" viewBox="0 0 88 88" id="ring"></svg>
    <div class="t-num-l abs" style="left:253px;top:34px;width:88px;text-align:center;">2</div>
    <div class="abs" style="left:20px;bottom:20px;display:flex;align-items:baseline;gap:6px;"><span class="t-num-l">2</span><span class="t-unit">things</span></div>
  </div>

  <!-- Kept: recipes light, range bar fading ink-3 to places-c, lime marker -->
  <div class="tile abs" style="left:16px;top:476px;width:176.5px;height:128px;background:radial-gradient(130% 110% at 100% 100%,var(--recipes-c) 0%,var(--recipes-d) 80%);">
    <div class="t-body abs" style="left:20px;top:16px;color:var(--ink);">Kept</div>
    <div class="abs" style="left:20px;top:52px;width:136.5px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--ink-3),var(--places-c));"></div>
    <svg class="abs" style="left:114.3px;top:51px" width="10.7" height="8.5" viewBox="0 0 10.7 8.5"><path d="M0 8.5 L5.35 0 L10.7 8.5 Z" style="fill:var(--lime)"/></svg>
    <div class="abs" style="left:20px;bottom:20px;display:flex;align-items:baseline;gap:6px;"><span class="t-num-l">11</span><span class="t-unit">things</span></div>
  </div>

  <!-- Dropped: events light, row of dots -->
  <div class="tile abs" style="left:200.5px;top:476px;width:176.5px;height:128px;background:radial-gradient(130% 110% at 100% 100%,var(--events-c) 0%,var(--events-d) 80%);">
    <div class="t-body abs" style="left:20px;top:16px;color:var(--ink);">Dropped</div>
    <svg class="abs" style="left:0;top:0" width="176.5" height="128" viewBox="0 0 176.5 128" id="dots"></svg>
    <div class="abs" style="left:20px;bottom:20px;display:flex;align-items:baseline;gap:6px;"><span class="t-num-l">6</span><span class="t-unit">things</span></div>
  </div>

  <!-- Coming up: products light, tick ruler with lime marker -->
  <div class="tile abs" style="left:16px;top:612px;width:176.5px;height:128px;background:radial-gradient(130% 110% at 100% 100%,var(--products-c) 0%,var(--products-d) 80%);">
    <div class="t-body abs" style="left:20px;top:16px;color:var(--ink);">Coming up</div>
    <div id="ticks"></div>
    <div class="abs" style="left:20px;bottom:20px;display:flex;align-items:baseline;gap:6px;"><span class="t-num-l">3</span><span class="t-unit">this week</span></div>
  </div>

  <!-- Expiring: places light with a products-c blob -->
  <div class="tile abs" style="left:200.5px;top:612px;width:176.5px;height:128px;background:var(--places-d);">
    <div class="light" style="left:73px;top:2px;width:130px;height:120px;background:var(--products-c);"></div>
    <div class="t-body abs" style="left:20px;top:16px;color:var(--ink);">Expiring</div>
    <div class="abs" style="left:20px;bottom:20px;display:flex;align-items:baseline;gap:6px;"><span class="t-num-l">1</span><span class="t-unit">thing</span></div>
  </div>

  <!-- tab bar: Home on -->
  <div class="tabbar" id="tabbar"></div>
  <script>
    document.getElementById('tabbar').innerHTML =
      `<div class="tab on">${icon('home',20)}Home</div>` +
      `<div class="tab">${icon('bookmark',20)}Saved</div>` +
      `<div class="tab">${icon('spark',20)}Reveals</div>`;
  </script>

  <div class="home-indicator"></div>
</div>
<script>
  (function () {
    // ring gauge in the Done tile: track, lime arc, faint secondary arc (88pt ring)
    const c = 44, r = 43.4;
    const arc = (a0, a1, rr) => {
      const p = a => [c + rr * Math.sin(a * Math.PI / 180), c - rr * Math.cos(a * Math.PI / 180)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rr} ${rr} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    };
    document.getElementById('ring').innerHTML = `
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/>
      <path d="${arc(15.3, 54, 44.4)}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-linecap="round"/>
      <path d="${arc(3, 80, r)}" fill="none" style="stroke:var(--lime)" stroke-width="1.6" stroke-linecap="round"/>`;

    // dot row in the Dropped tile (x positions scaled from the reference to the 176.5pt tile)
    const dx = [21.6, 48.1, 68.4, 86.5, 98.9, 117, 125.9, 138.4, 153];
    document.getElementById('dots').innerHTML = dx.map(x => `<circle cx="${x}" cy="56" r="2" style="fill:var(--ink)"/>`).join('');

    // ruler ticks in the Coming up tile, with the lime marker
    const t = document.getElementById('ticks');
    let html = '';
    for (let i = 0; i < 14; i++) html += `<div class="tick" style="left:${(20.5 + i * 8.46).toFixed(2)}px;top:45px"></div>`;
    html += `<svg class="abs" style="left:137.5px;top:36px" width="9.5" height="9" viewBox="0 0 9.5 9"><path d="M0 0 L9.5 0 L4.75 9 Z" style="fill:var(--lime)"/></svg>`;
    html += `<div class="abs" style="left:141.6px;top:45px;width:1.2px;height:19px;background:var(--lime);"></div>`;
    html += `<div class="tick" style="left:150.6px;top:45px"></div>`;
    t.innerHTML = html;
  })();
</script>
</body></html>
