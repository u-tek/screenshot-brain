<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit3.css"><script src="kit.js"></script><script src="kit3.js"></script>
<style>
  .apps { position: absolute; left: 30px; right: 30px; display: grid; grid-template-columns: repeat(4, 62px); justify-content: space-between; row-gap: 30px; }
  .app { width: 62px; height: 62px; border-radius: 16px; background: rgba(255,255,255,.14); }
  .w { position: absolute; border-radius: 26px; overflow: hidden; isolation: isolate; }
</style></head>
<body><div class="phone" id="p" style="background:#1b1410">
  <!-- A wallpaper: someone in motion, blurred to colour (ref 10). -->
  <svg width="393" height="852" style="position:absolute;inset:0"><filter id="wp"><feGaussianBlur stdDeviation="46 18"/></filter>
    <g filter="url(#wp)"><rect width="393" height="852" fill="#2a1d14"/><ellipse cx="120" cy="300" rx="120" ry="260" fill="#e08a2a"/><ellipse cx="260" cy="420" rx="110" ry="300" fill="#3a0d0a"/><ellipse cx="320" cy="160" rx="90" ry="120" fill="#c9b8a0"/><ellipse cx="200" cy="700" rx="200" ry="160" fill="#7a2a10"/></g></svg>
  <div class="grain" style="opacity:.24"></div>
  <div id="status"></div>

  <div style="position:absolute;top:96px;left:0;right:0;text-align:center;font-size:15px;font-weight:500;color:rgba(255,255,255,.85)">Wednesday 8 October</div>

  <!-- Medium widget: the folder, its screenshot's light on the left, the decision on the right. -->
  <div class="w" id="medium" style="top:150px;left:24px;width:345px;height:162px;background:linear-gradient(160deg,#26262b,#141417 55%,#101013)">
    <div id="mshot" style="position:absolute;left:-30px;top:-20px;width:180px;height:210px;opacity:.85"></div>
    <div style="position:absolute;left:60px;top:0;bottom:0;width:110px;background:linear-gradient(90deg,rgba(21,21,24,0),#151518 80%)"></div>
    <div id="mprint" style="position:absolute;left:22px;top:36px;width:60px;height:110px;border-radius:10px;overflow:hidden;transform:rotate(-4deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #0a0306,0 12px 20px rgba(0,0,0,.55)"></div>
    <div style="position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none"></div>
    <div style="position:absolute;left:146px;right:16px;top:18px;bottom:14px;display:flex;flex-direction:column">
      <span class="mono">Event · Friday</span>
      <span style="font-size:16px;font-weight:600;letter-spacing:-.2px;margin-top:7px;line-height:1.2">Mallrat at the Enmore</span>
      <span style="flex:1"></span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="key dark" style="width:36px;height:36px">${x}</span>
        <span class="key dark" style="height:36px;padding:0 14px;font-size:13px">Keep</span>
        <span style="flex:1"></span>
        <span class="key lime" style="width:40px;height:40px">${check}</span>
      </div>
    </div>
    <div class="mono" style="position:absolute;top:8px;left:14px;color:#fff">Tonight</div>
  </div>

  <!-- Small widget: the score as an instrument. -->
  <div class="w" style="top:336px;left:24px;width:160px;height:160px;background:linear-gradient(160deg,#26262b,#141417 55%,#101013);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)">
    <div class="glow" style="width:220px;height:140px;left:-30px;top:110px;background:radial-gradient(closest-side,var(--ref-core),transparent);opacity:.5"></div>
    <div style="position:relative;z-index:2;padding:16px">
      <span class="mono">Score</span>
      <div class="glow" style="left:-10px;top:30px;width:120px;height:110px;background:radial-gradient(closest-side,#f6e7c4,rgba(217,255,61,.3) 55%,transparent);filter:blur(22px);opacity:.7"></div>
      <div style="display:flex;align-items:flex-end;gap:4px;margin-top:-4px;position:relative"><div id="sscore"></div><span style="font-size:15px;font-weight:300;color:var(--ink-2);margin-bottom:22px">/23</span></div>
    </div>
  </div>
  <!-- Small widget: what's next, lit by its own screenshot. -->
  <div class="w" id="small2" style="top:336px;left:209px;width:160px;height:160px;background:#121214">
    <div id="s2" style="position:absolute;inset:0"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.7))"></div>
    <div style="position:absolute;left:16px;bottom:14px;right:14px"><span class="mono" style="color:#fff">Place · 3 wks</span><div style="font-size:15px;font-weight:600;margin-top:5px">Ramen Ikkyu</div></div>
  </div>

  <div class="apps" style="top:530px"><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div></div>
  <div class="glass" style="position:absolute;left:14px;right:14px;bottom:18px;height:92px;border-radius:34px;background:rgba(255,255,255,.12)"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const P = document.getElementById("p");
  P.innerHTML = P.innerHTML.replace("${x}", icon("x", 16)).replace("${check}", icon("check", 20, "#0b0b0d"));
  document.getElementById("status").outerHTML = statusBar(true);
  document.getElementById("mshot").innerHTML = screenshot("event", 180, 210, { blurX: 26, blurY: 14 });
  document.getElementById("s2").innerHTML = screenshot("place", 160, 160, { blurX: 18, blurY: 6 });
  document.getElementById("sscore").innerHTML = glassType("6", { size: 92, width: 64, height: 92, tint: "#f2dfbd", depth: 5 });
  document.getElementById("mprint").innerHTML = screenshot("event", 60, 110, { sharp: true });
  folderClip(document.getElementById("medium"), { tab: 0.3, tabH: 14, r: 24 });
  folderClip(document.getElementById("small2"), { tab: 0.5, tabH: 12, r: 24 });
</script></body></html>
