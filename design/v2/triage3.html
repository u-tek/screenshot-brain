<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit3.css"><script src="kit.js"></script><script src="kit3.js"></script>
<style>
  .bars { position: absolute; top: 58px; left: 20px; right: 20px; display: flex; gap: 5px; z-index: 5; }
  .bars span { flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,.18); }
  .bars span.on { background: #fff; }
  .top { position: absolute; top: 74px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .deck { position: absolute; left: 24px; width: 345px; height: 540px; border-radius: 30px; }
</style></head>
<body><div class="phone" id="p">
  <div id="status"></div>
  <div class="bars"><span class="on"></span><span></span><span></span><span></span></div>
  <div class="top"><span class="mono">Tonight's recap · 1 of 4</span><span class="key dark mono" style="height:30px;padding:0 13px;font-size:10px;letter-spacing:.1em">Later ✕</span></div>

  <!-- The deck: the next cards wait behind, tipped back, each lit by its own screenshot. -->
  <div class="pool" style="left:20px;top:640px;width:353px;height:110px;background:var(--event-core);opacity:.6"></div>
  <div class="slab deck" style="top:110px;transform:scale(.86);transform-origin:50% 0;opacity:.6;filter:brightness(.55)">
    <div class="face"><div class="glow" style="width:300px;height:260px;left:30px;top:40px;background:radial-gradient(closest-side,var(--product-core),var(--product-deep) 60%,transparent)"></div></div></div>
  <div class="slab deck" style="top:124px;transform:scale(.93);transform-origin:50% 0;opacity:.85;filter:brightness(.72)">
    <div class="face"><div class="glow" style="width:300px;height:260px;left:30px;top:40px;background:radial-gradient(closest-side,var(--place-core),var(--place-deep) 60%,transparent)"></div></div></div>

  <!-- The card on top: a thick acrylic folder, the screenshot set into it like a print under glass. -->
  <div class="deck" id="card" style="top:150px;transform:rotate(-1.2deg);filter:drop-shadow(0 1px 0 #3a1024) drop-shadow(0 2px 0 #2a0b19) drop-shadow(0 2px 0 #1f0812) drop-shadow(0 2px 0 #18060e) drop-shadow(0 20px 26px rgba(0,0,0,.6))">
    <div class="face" id="face" style="background:#16070f">
      <div id="glow" style="position:absolute;inset:-50px;opacity:.95"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 30%,rgba(0,0,0,.25) 70%)"></div>
    </div>
    <div class="mono" style="position:absolute;top:9px;left:22px;z-index:3;color:#fff;display:flex;gap:8px;align-items:center"><span style="width:6px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff"></span>Event</div>
    <div id="print" style="position:absolute;top:50px;left:50%;transform:translateX(-50%);width:172px;height:316px;border-radius:20px;overflow:hidden;z-index:2;
      box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 0 #0b0307,0 3px 0 #0a0306,0 24px 50px rgba(0,0,0,.55)"></div>
    <!-- A sheen across the acrylic. -->
    <div id="sheen" style="position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 38%,rgba(255,255,255,0) 48%)"></div>
    <svg width="345" height="540" style="position:absolute;inset:0;z-index:5;pointer-events:none"><defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".25" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient></defs><path id="rimpath" fill="none" stroke="url(#rim)" stroke-width="1.2"/></svg>
    <div class="glass" style="position:absolute;left:10px;right:10px;bottom:10px;border-radius:22px;padding:16px 18px;z-index:4;background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(30,8,18,.55) 40%,rgba(20,6,12,.72))">
      <div class="mono">Saved 2 weeks ago · 2 screenshots</div>
      <div style="font-size:24px;font-weight:300;letter-spacing:-.4px;margin-top:8px;line-height:1.15">Mallrat · <span class="semi">Enmore Theatre</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span class="mono" style="color:var(--ink)">Sun 11 Oct · 8pm</span>
        <span class="key dark" style="height:34px;padding:0 14px;font-size:13px">${cal} Calendar</span>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:6">
    <span class="key dark" style="width:62px;height:62px">${x}</span>
    <span class="key dark" style="height:62px;padding:0 30px;font-size:16px">Still want</span>
    <span class="key lime" style="width:62px;height:62px">${check}</span>
  </div>
  <div class="grain"></div>
  <div class="home-indicator"></div>
</div>
<script>
  const P = document.getElementById("p");
  P.innerHTML = P.innerHTML.replace("${cal}", icon("cal", 14)).replace("${x}", icon("x", 22)).replace("${check}", icon("check", 26, "#0b0b0d"));
  document.getElementById("status").outerHTML = statusBar(true);
  document.getElementById("glow").innerHTML = screenshot("event", 445, 640, { blurX: 46, blurY: 30 });
  document.getElementById("print").innerHTML = screenshot("event", 172, 316, { sharp: true });
  document.getElementById("face").style.clipPath = `path('${folderPath(345, 540, { tab: 0.34, tabH: 26, r: 30 })}')`;
  const fp = folderPath(345, 540, { tab: 0.34, tabH: 26, r: 30 });
  document.getElementById("sheen").style.clipPath = `path('${fp}')`;
  document.getElementById("rimpath").setAttribute("d", fp);
</script></body></html>
